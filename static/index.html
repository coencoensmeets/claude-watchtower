    button.className = "segmented__item md-state";
    button.type = "button";
    button.setAttribute("aria-pressed", String(level.key === settings.contrast));
    button.innerHTML = `${ICON.check}<span>${level.label}</span>`;
    button.addEventListener("click", () => {
      settings.contrast = level.key; persist(); applyScheme(); renderContrast();
    });
    contrastGroup.appendChild(button);
  }
}
/* The notification switches, and the one thing worth saying under them: the
   browser has its own permission, and a switch turned on behind a refused one
   would sit there promising something that cannot happen. */
function renderNotify() {
  const box = detailPane.querySelector("#notifySwitches");
  if (!box) return;
  box.innerHTML = NOTIFY_KINDS.map((kind) => `<label class="switch">
      <input type="checkbox" data-notify="${kind.key}" ${settings.notify[kind.key] ? "checked" : ""}>
      <span class="switch__track"><span class="switch__thumb">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span></span>
      <span class="switch__label md-body-medium">${escapeHtml(kind.label)}<span
        class="switch__says md-label-small"><b>${escapeHtml(kind.says[0])}</b>${
        escapeHtml(kind.says[1])}</span></span>
    </label>`).join("");
  for (const input of box.querySelectorAll("[data-notify]")) {
    input.addEventListener("change", () => {
      settings.notify[input.dataset.notify] = input.checked;
      persist();
    });
  }
  paintNotifyPermission();
}

/* The switches above decide what the panel would like to tell you. Whether it
   is allowed to tell you anything is the browser's to say, and it is a separate
   question with a separate answer — so it gets its own notice rather than a
   line of small print, and where there is something to press, the notice is
   the thing that presses it. */
function paintNotifyPermission() {
  const box = detailPane.querySelector("#notifyHint");
  if (!box) return;
  const state = "Notification" in window ? Notification.permission : "unsupported";
  box.hidden = state === "granted";
  box.dataset.state = state;
  if (state === "granted") return;
  if (state === "default") {
    box.innerHTML = `<p class="md-body-medium">Your browser has not let the panel show
        notifications yet. None of the switches above can reach you until it does.</p>
      <button class="button button--filled md-state" id="askNotify">Allow notifications</button>`;
    box.querySelector("#askNotify").addEventListener("click", async () => {
      await Notification.requestPermission();
      paintNotifyPermission();
    });
    return;
  }
  box.innerHTML = state === "unsupported"
    ? `<p class="md-body-medium">This browser cannot show desktop notifications, so none of
        the switches above can reach you. The tab title and the favicon still count the
        sessions waiting.</p>`
    : `<p class="md-body-medium">Your browser is blocking notifications from the panel, so
        none of the switches above can reach you. Turn them back on in the browser's own
        settings for this site — the padlock or the icon at the left of the address bar.</p>`;
}

/* The settings page, drawn where a conversation would be rather than over the
   top of one.

   A dialog was the wrong shape for it: nothing here is a decision to come back
   from — every switch takes effect as it is pressed and there is nothing to
   confirm — so the scrim was buying a modality the page did not want, and it
   put a scrolling box inside a scrolling box on a short window. As a pane it is
   simply another thing the panel can be showing, reached from the gear and left
   by picking any session. */
function settingsPage() {
  return `
    <header class="detail-header detail-header--plain">
      <div class="detail-header__top">
        <div class="detail-header__text">
          <div class="detail-header__title"><h2 class="md-headline-small">Settings</h2></div>
          <div class="detail-header__meta"><span class="md-body-small">
            How the panel looks, and what it tells you about</span></div>
        </div>
        <div class="detail-header__actions">
          <button class="button button--outlined md-state" id="closeSettings">Done</button>
        </div>
      </div>
    </header>
    <div class="tab-panel">
      <!-- Theme and Contrast are one control each, so they sit beside each
           other on a pane wide enough for both. The swatches take the row under
           them, because they wrap and a third of the pane makes them taller
           than the two settings above put together. -->
      <div class="settings-row">
        <section class="section">
          <h3 class="section__title md-title-small">Theme</h3>
          <label class="switch">
            <input type="checkbox" id="themeToggle" aria-label="Dark theme">
            <span class="switch__track"><span class="switch__thumb">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span></span>
            <span class="switch__label md-body-medium" id="themeLabel">Light</span>
          </label>
        </section>
        <section class="section">
          <h3 class="section__title md-title-small">Contrast</h3>
          <div class="segmented" id="contrastGroup" role="group" aria-label="Contrast level"></div>
        </section>
        <section class="section settings-row__wide">
          <h3 class="section__title md-title-small">Base colour</h3>
          <p class="md-body-medium">Every colour is derived from one base.</p>
          <div class="swatches" id="swatches"></div>
          <p class="seed-readout md-body-small" id="seedReadout"></p>
        </section>
      </div>
      <!-- Which kinds of notification are wanted at all, for every session at
           once. The switches in a session's own Details tab choose which
           sessions may use the kinds turned on here. -->
      <section class="section">
        <h3 class="section__title md-title-small">Notifications</h3>
        <p class="md-body-medium">Raise a desktop notification when a session…</p>
        <div class="notify-grid" id="notifySwitches"></div>
        <div class="notify-permission" id="notifyHint" hidden></div>
      </section>
      <section class="section">
        <button class="button button--text md-state" id="resetTheme">Reset colours</button>
      </section>
    </div>`;
}

/* Painted once and then left alone: every control on it keeps its own state,
   and a poll rebuilding the pane underneath would take the focus off whatever
   was just pressed. */
function paintSettings() {
  if (detailPane.dataset.signature === "settings:page") return;
  detailPane.dataset.signature = "settings:page";
  detailPane.innerHTML = settingsPage();
  syncTheme();
  renderSwatches();
  renderContrast();
  renderNotify();
  detailPane.querySelector("#themeToggle").addEventListener("change", (event) => {
    settings.dark = event.target.checked;
    persist();
    applyScheme();
  });
  detailPane.querySelector("#closeSettings").addEventListener("click", () => openSettings(false));
  detailPane.querySelector("#resetTheme").addEventListener("click", () => {
    // Colours only. The button sits under the notification switches, and wiping
    // those as well would be a surprise the label does not warn about.
    settings = { ...settings, seed: DEFAULT_SEED,
      dark: matchMedia("(prefers-color-scheme: dark)").matches, contrast: "standard" };
    persist(); applyScheme(); renderSwatches(); renderContrast(); showSnackbar("Colours reset");
  });
}

function setSeed(hex) { settings.seed = hex; persist(); applyScheme(); renderSwatches(); }
/* ------------------------------------------------------- ending a session */
let endTarget = null;
function openEndDialog(session) {
  endTarget = session;
  const waiting = session.status === "waiting" || session.status === "busy" || session.status === "shell";
  // A session the panel holds has no pid worth naming — the process is ours, and
  // ending it is the panel letting go rather than a signal to a terminal.
  const holding = session.alive === false && ownedFor(session).running;
  // Ending is the only way out, so the dialog has to say what becomes of the row
  // as well as the process: it goes, unless the session was pinned on purpose.
  const fate = session.pinned
    ? `It is pinned, so the row stays: type into it and it starts back up.`
    : `The row comes off the dashboard. The conversation stays on disk, where
       <span class="md-mono">claude --resume</span> in
       <span class="md-mono">${escapeHtml(session.folder || shorten(session.cwd, 1))}</span> still finds it.`;
  document.getElementById("endHeadline").textContent = holding
    ? (session.pinned ? "Stop running it here?" : "Stop it and remove the row?")
    : "End this session?";
  document.getElementById("endSupporting").innerHTML = holding
    ? `The panel lets go of <span class="md-mono">${escapeHtml(session.name)}</span>.
       ${session.status === "busy" ? "Mid-turn — what it is doing stops. " : ""}${fate}`
    : `<span class="md-mono">${escapeHtml(session.name)}</span> in
       <span class="md-mono">${escapeHtml(shorten(session.cwd, 2))}</span>, pid
       <span class="md-mono">${session.pid}</span>.
       ${waiting ? "Mid-turn — what it is doing stops. " : ""}${fate}`;
  // Force is a signal, and there is nothing to signal when the process is a pipe
  // of ours: the panel closes it and waits. So the harder button is not offered.
  document.getElementById("endForce").hidden = holding;
  document.getElementById("endConfirm").textContent = holding
    ? (session.pinned ? "Stop it" : "Stop it and remove") : "End session";
  endScrim.dataset.open = "true";
  document.getElementById("endCancel").focus();
}
function closeEndDialog() {
  endScrim.dataset.open = "false";
  endTarget = null;
  detailPane.querySelector("[data-act='end']")?.focus();
}
/* Starting a session the panel runs. There is nothing to ask first: the panel
   names the session itself — `--session-id` takes a uuid of our choosing — so
   the row exists the moment it is started and the first message is the first
   thing you type into it, in the session, like any other. */
async function startOwnedSession(where, item) {
  if (item) item.disabled = true;
  showSnackbar(where.pick ? "Pick a folder in the chooser…" : "Starting it…", 300000);
  try {
    const response = await fetch("/api/owned/new", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(where.pick ? { pick: true } : { sessionId: where.from.sessionId }),
    });
    const data = await response.json().catch(() => ({}));
    showSnackbar(data.message || (response.ok ? "Started" : "That did not start"));
    if (data.ok && data.sessionId) {
      selectedId = data.sessionId;
      localStorage.setItem("cbu-selected", data.sessionId);
      setTab("chat");
      await poll();
      detailPane.querySelector("#sayField")?.focus();
    }
  } catch (error) {
    showSnackbar("Could not reach the server");
  } finally {
    if (item) item.disabled = false;
  }
}

/* Making a live session interactive. The wording names what is lost — the
   terminal — and what is not, which is the conversation: the row is kept before
   anything is signalled, so the chat is still there afterwards. */
const adoptScrim = document.getElementById("adoptScrim");
let adoptTarget = null;

function openAdoptDialog(session) {
  adoptTarget = session;
  const name = `<span class="md-mono">${escapeHtml(session.name)}</span>`;
  // Only the conversation is worth a clause, and only when there is one: saying
  // "the conversation is kept" about a session nobody has typed at yet reads as
  // a warning where nothing is at stake.
  const carried = session.spoken ? " The conversation is kept." : "";
  document.getElementById("adoptSupporting").innerHTML =
    `${name} runs in a terminal, so making it interactive <strong>ends that session</strong>.${carried}
     You then type to it here, pick its mode, and answer its prompts. It stays that way:
     the panel does not hand a conversation back to a terminal.`;
  document.getElementById("adoptForce").hidden = true;
  adoptScrim.dataset.open = "true";
  document.getElementById("adoptConfirm").focus();
}

function closeAdoptDialog() {
  adoptScrim.dataset.open = "false";
  adoptTarget = null;
}

document.getElementById("adoptCancel").addEventListener("click", closeAdoptDialog);
adoptScrim.addEventListener("click", (event) => { if (event.target === adoptScrim) closeAdoptDialog(); });
/* Force is not offered up front. A session mid-turn takes a moment to stop, and
   the first thing to try is asking it to — so the harder button only appears
   once asking has demonstrably not worked. */
async function adopt(button, force) {
  const session = adoptTarget;
  if (!session) return;
  button.disabled = true;
  showSnackbar(force ? "Forcing it to stop…" : "Ending the terminal session…", 20000);
  try {
    const response = await fetch("/api/owned/adopt", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: session.sessionId, force }),
    });
    const data = await response.json().catch(() => ({}));
    showSnackbar(data.message || (response.ok ? "Done" : "That did not work"));
    if (data.ok) {
      // Landing on it with the caret in the box is the whole point of the word
      // "interactive": there is nothing further to do but type.
      const id = session.sessionId;
      closeAdoptDialog();
      selectedId = id;
      localStorage.setItem("cbu-selected", id);
      await poll();
      detailPane.querySelector("#sayField")?.focus();
    } else if (data.needsForce) {
      document.getElementById("adoptForce").hidden = false;
    }
  } catch (error) {
    showSnackbar("Could not reach the server");
  } finally {
    button.disabled = false;
    poll();
  }
}

/* Compacting: the session summarises what has happened so far and carries on
   from the summary instead of from the whole conversation.

   It asks first. Not because anything is lost from disk — the transcript is
   untouched and the chat above still reads the same afterwards — but because
   what the session *remembers* is replaced by a summary of itself, and there is
   no putting it back. That is a decision, and a decision one mis-click away from
   a button that sits in the header is a decision made by accident. It also takes
   the better part of a minute, which the dialog says rather than leaving you
   wondering whether the click registered.

   The percentage does not move afterwards, and this is not a bug worth chasing:
   the reading comes off the last request the model answered, so it only catches
   up when the session is next used. What the compaction did is reported from its
   own frames instead — see contextBar. */
async function compactSession(session, button) {
  const ctx = session.context;
  const ok = await askConfirm({
    headline: "Compact this conversation?",
    body: `<span class="md-mono">${escapeHtml(session.name)}</span> summarises everything so far
      and carries on from that summary${ctx ? `, in place of the
      ${escapeHtml(tokens(ctx.tokens))} tokens it is carrying now` : ""}. It takes
      up to a minute, and it cannot be undone — though nothing is lost from the
      transcript, so the conversation above still reads the same.`,
    confirmLabel: "Compact it",
    danger: false,
  });
  if (!ok) return;
  await run("/api/owned/compact", session, button, "Compacting…");
}

/* Taking a row off the list. The conversation is not what goes — the transcript
   is Claude Code's and stays where it is, so this is the row and nothing else,
   which is why it asks in one line rather than spelling out a loss. A session
   the panel is running is stopped on the way out: a held process with no row is
   a session nobody can see. */
async function openForgetDialog(session) {
  const running = ownedFor(session).running;
  const ok = await askConfirm({
    headline: running ? "Stop it and remove the row?" : "Remove this row?",
    body: `<span class="md-mono">${escapeHtml(session.name)}</span> comes off the list${running
      ? `, and the turn it is holding open here is stopped`
      : ``}. The conversation itself stays on disk, where
      <span class="md-mono">claude --resume</span> in ${escapeHtml(session.folder || "its folder")} still finds it.`,
    confirmLabel: running ? "Stop it and remove" : "Remove",
  });
  if (!ok) return;
  try {
    const response = await fetch("/api/forget", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: session.sessionId }),
    });
    const data = await response.json().catch(() => ({}));
    showSnackbar(data.message || (response.ok ? "Removed" : "That did not work"));
    if (data.ok && selectedId === session.sessionId) {
      selectedId = null;
      localStorage.removeItem("cbu-selected");
    }
  } catch (error) {
    showSnackbar("Could not reach the server");
  }
  poll();
}

document.getElementById("adoptConfirm").addEventListener("click", (e) => adopt(e.currentTarget, false));
document.getElementById("adoptForce").addEventListener("click", (e) => adopt(e.currentTarget, true));

document.getElementById("endCancel").addEventListener("click", closeEndDialog);
endScrim.addEventListener("click", (event) => { if (event.target === endScrim) closeEndDialog(); });
for (const [id, force] of [["endConfirm", false], ["endForce", true]]) {
  document.getElementById(id).addEventListener("click", async (event) => {
    const session = endTarget;
    if (!session) return;
    const data = await run("/api/end", session, event.currentTarget, null, { force });
    if (data?.removed && selectedId === session.sessionId) {
      selectedId = null;
      localStorage.removeItem("cbu-selected");
    }
    closeEndDialog();
  });
}

/* ------------------------------------------------------- asking first */

/* One dialog, awaited rather than called back into: the caller reads like the
   sentence it is — ask, and if the answer is yes, do the thing. */
const askScrim = document.getElementById("askScrim");
let askResolve = null;

/* The same dialog with a field in it, for the one question that needs a word
   back rather than a yes: what to call a new branch. Resolves to the trimmed
   text, or null if it was dismissed. */
function askText({ headline, body, placeholder = "", value = "", confirmLabel = "Create" }) {
  // The dialog goes up first: opening one closes whatever stood before it, and
  // that closing is what puts the field away — reveal it before, and it is
  // hidden again by the time anyone could type in it.
  const answer = askConfirm({ headline, body, confirmLabel, danger: false });
  const field = document.getElementById("askField");
  field.hidden = false;
  field.placeholder = placeholder;
  field.value = value;
  field.focus();
  field.select();
  return answer.then((ok) => (ok ? field.value.trim() || null : null));
}

function askConfirm({ headline, body, confirmLabel = "Confirm", danger = true }) {
  closeAsk(false);
  document.getElementById("askHeadline").textContent = headline;
  document.getElementById("askSupporting").innerHTML = body;
  const confirm = document.getElementById("askConfirm");
  confirm.textContent = confirmLabel;
  // Red is for the answers that lose something. A question that only asks before
  // overwriting a box you can retype is not one of them.
  confirm.classList.toggle("button--danger", danger);
  confirm.classList.toggle("button--filled", !danger);
  askScrim.dataset.open = "true";
  document.getElementById("askCancel").focus();
  return new Promise((resolve) => { askResolve = resolve; });
}

function closeAsk(answer) {
  askScrim.dataset.open = "false";
  // The field belongs to whichever question asked for it, so it goes away with
  // that question rather than lingering into the next one.
  document.getElementById("askField").hidden = true;
  const resolve = askResolve;
  askResolve = null;
  if (resolve) resolve(answer);
}

// Enter in the field is the same as pressing the confirming button beside it.
document.getElementById("askField").addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  closeAsk(true);
});

document.getElementById("askCancel").addEventListener("click", () => closeAsk(false));
document.getElementById("askConfirm").addEventListener("click", () => closeAsk(true));
askScrim.addEventListener("click", (event) => { if (event.target === askScrim) closeAsk(false); });

/* ==========================================================================
   The plan — how much of a subscription has gone, which is the one figure in this
   panel that no file on this machine knows. The server runs Claude Code's own
   `/usage` for it, so the reading is the same one the terminal would give you.
   ========================================================================== */
const planScrim = document.getElementById("planScrim");
const planButton = document.getElementById("planButton");
const planChipText = document.getElementById("planChipText");

/* Five seconds and a process per reading, and a figure that moves in points
   over hours: so it is read on the clock rather than on the poll, and not at
   all while nobody is looking at the page. */
const PLAN_POLL_MS = 300_000;
let plan = null;
let planBusy = false;
let planPolledAt = 0;
let planGone = false;      // the panel is read-only, so there is nothing to ask

async function fetchPlan(force) {
  if (planBusy || planGone) return;
  if (!force && document.hidden) return;
  if (!force && Date.now() - planPolledAt < PLAN_POLL_MS) return;
  planBusy = true;
  planPolledAt = Date.now();
  paintPlanChip();
  try {
    const response = await fetch(`/api/plan${force ? "?force=1" : ""}`, { cache: "no-store" });
    if (response.status === 403) {
      // Reading it means running a command, which a panel serving the network
      // does not do. The chip goes rather than sitting there refusing.
      planGone = true;
      planButton.hidden = true;
      return;
    }
    if (!response.ok) throw new Error(String(response.status));
    plan = await response.json();
    // A reading already in flight elsewhere: come back for its answer shortly
    // rather than waiting on this request.
    if (plan.reading) planPolledAt = Date.now() - PLAN_POLL_MS + 4000;
  } catch (error) {
    /* leave the last reading on screen */
  } finally {
    planBusy = false;
    paintPlanChip();
    if (planScrim.dataset.open === "true") paintPlanDialog();
  }
}

/* The two figures worth an app bar: how much of the current session's allowance
   has gone, and how much of the week's. Whichever is tighter colours the chip. */
function planHeadline() {
  const limits = plan?.limits || [];
  const session = limits.find((l) => /session/i.test(l.name));
  const week = limits.find((l) => /week/i.test(l.name) && !/\(/.test(l.name))
    || limits.find((l) => /week.*all models/i.test(l.name))
    || limits.find((l) => /week/i.test(l.name));
  return [session, week].filter(Boolean);
}

function paintPlanChip() {
  if (planGone) { planButton.hidden = true; return; }
  planButton.hidden = false;
  planButton.dataset.reading = planBusy || plan?.reading ? "1" : "0";
  const shown = planHeadline();
  if (!shown.length) {
    planChipText.textContent = plan?.ok === false ? "plan?" : "plan";
    planButton.dataset.tight = "0";
    planButton.title = plan?.message || "How much of your plan has gone";
    return;
  }
  // Used, not left: it reads the same way the bars below it do, and the colour
  // says how worried to be without doing the subtraction in your head.
  planChipText.innerHTML = shown
    .map((l) => `<span class="plan-pct" data-band="${planBand(l.percent)}">${l.percent}%</span>`)
    .join(`<span class="plan-chip__sep">·</span>`);
  const worst = Math.max(...shown.map((l) => l.percent));
  planButton.dataset.tight = String(planBand(worst));
  planButton.title = `${shown.map((l) => `${l.name}: ${l.percent}% used`).join(", ")} — press for the rest`;
}

/* One scale for every plan figure: room, tight, nearly gone. */
const planBand = (percent) => (percent >= 90 ? 2 : percent >= 75 ? 1 : 0);

function planBar(limit) {
  const tight = planBand(limit.percent);
  return `<div class="plan-limit">
    <div class="plan-limit__head">
      <span class="md-body-medium">${escapeHtml(limit.name)}</span>
      <span class="plan-limit__pct plan-pct md-title-medium md-mono"
            data-band="${tight}">${limit.percent}% used</span>
    </div>
    <div class="use-bar">
      <div class="use-bar__fill" style="width: ${limit.percent ? Math.max(1, limit.percent) : 0}%" data-tight="${tight}"></div>
    </div>
    <div class="use-legend md-label-small">
      <span>${limit.resets ? `resets ${escapeHtml(limit.resets)}` : "nothing used yet"}</span>
    </div>
  </div>`;
}

function paintPlanDialog() {
  const head = document.getElementById("planHead");
  const body = document.getElementById("planBody");
  const age = document.getElementById("planAge");
  if (!plan) {
    head.textContent = "Reading your usage…";
    head.hidden = false;
    body.innerHTML = "";
    age.textContent = "";
    return;
  }
  const limits = plan.limits || [];
  // `/usage`'s own headline only ever says you are on a subscription, which the
  // dialog is already about. It is worth the line only when something failed.
  head.textContent = limits.length ? (plan.message || "") : (plan.message || plan.headline || "");
  head.hidden = !head.textContent;
  body.innerHTML = `
    ${limits.length ? limits.map(planBar).join("")
      : plan.text ? `<p class="plan-raw md-body-small">${escapeHtml(plan.text)}</p>`
      : `<p class="md-body-medium">Nothing came back.</p>`}
    ${(plan.blocks || []).map((block) => {
      // Figures only. `/usage` pads each block with a sentence or two of
      // caveat, and a line carrying no number is one of those.
      const lines = block.lines.filter((line) => /\d/.test(line));
      return lines.length ? `<section class="plan-block">
        <h3 class="plan-block__title md-title-small">${escapeHtml(block.title)}</h3>
        <ul class="md-body-small">${lines
          .map((line) => `<li>${escapeHtml(line)}</li>`).join("")}</ul>
      </section>` : "";
    }).join("")}`;
  age.textContent = plan.at
    ? planBusy || plan.reading ? "reading…" : `read ${ago(Date.now() / 1000 - plan.at)}`
    : "";
}

function openPlan(open) {
  planScrim.dataset.open = String(open);
  if (!open) { planButton.focus(); return; }
  paintPlanDialog();
  document.getElementById("closePlan").focus();
  // Opening it is asking for the figure, so a stale one is refreshed there and
  // then rather than at the next tick of the clock.
  if (!plan || Date.now() / 1000 - (plan.at || 0) > PLAN_POLL_MS / 1000) fetchPlan(true);
}

planButton.addEventListener("click", () => openPlan(true));
document.getElementById("closePlan").addEventListener("click", () => openPlan(false));
document.getElementById("planRefresh").addEventListener("click", () => { fetchPlan(true); paintPlanDialog(); });
planScrim.addEventListener("click", (event) => { if (event.target === planScrim) openPlan(false); });

function openSettings(open) {
  showingSettings = open;
  settingsButton.setAttribute("aria-pressed", String(open));
  // On one pane at a time the page is the detail side, so opening it has to
  // bring that side forward the way picking a session does.
  if (open) panes.dataset.view = "detail";
  // The pane it is leaving is a session's, and that session's signature is
  // still on the pane — clear it or the rebuild is skipped as a repeat.
  detailPane.dataset.signature = "";
  render();
  if (open) detailPane.querySelector("#closeSettings")?.focus();
  else settingsButton.focus();
}
settingsButton.addEventListener("click", () => openSettings(!showingSettings));
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if (askScrim.dataset.open === "true") closeAsk(false);
  else if (adoptScrim.dataset.open === "true") closeAdoptDialog();
  else if (endScrim.dataset.open === "true") closeEndDialog();
  else if (planScrim.dataset.open === "true") openPlan(false);
  else if (showingSettings) openSettings(false);
  // A comparison standing in front of the conversation is the nearest thing to
  // modal in the pane, and Escape is how you come back out of it.
  else if (hideChange()) { /* the conversation is back */ }
  // Nothing modal is open, so Escape drops whatever rows are picked.
  else clearPicked();
});
backButton.addEventListener("click", () => { panes.dataset.view = "list"; });
pickGroup.addEventListener("click", () => groupPicked());
pickClear.addEventListener("click", () => clearPicked());

/* ----------------------------------------------------------- interactions */
document.addEventListener("pointerdown", (event) => {
  const target = event.target.closest(".md-state");
  if (!target || target.disabled) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = target.getBoundingClientRect();
  const size = Math.max(box.width, box.height);
  const ripple = document.createElement("span");
  ripple.className = "md-ripple";
  ripple.style.width = ripple.style.height = `${size}px`;
  ripple.style.left = `${event.clientX - box.left - size / 2}px`;
  ripple.style.top = `${event.clientY - box.top - size / 2}px`;
  target.appendChild(ripple);
  ripple.addEventListener("animationend", () => ripple.remove());
});

/* -------------------------------------------------------------------- boot */
loadSettings();
applyScheme();
if (selectedId) panes.dataset.view = "detail";
poll();
setInterval(poll, 1000);
fetchPlan(true);
setInterval(() => fetchPlan(false), 30_000);
setInterval(() => {
  const now = Date.now() / 1000 + skew;
  for (const node of document.querySelectorAll("[data-since]")) {
    node.textContent = duration(now - Number(node.dataset.since));
  }
  // The compaction bar moves on the clock, not on the wire — nothing arrives
  // between `compacting` and the result — so it is walked forward here for the
  // same reason the durations are, rather than by repainting the pane at 1Hz
  // for a number the signature cannot see change.
  for (const bar of document.querySelectorAll("[data-compact-since]")) {
    const going = compactPct(now - Number(bar.dataset.compactSince));
    const fill = bar.querySelector(".ctx__fill");
    if (fill) fill.style.width = `${Math.max(2, going)}%`;
    bar.setAttribute("aria-label", `Compacting, about ${going}% of the way`);
    const said = bar.parentElement?.querySelector(".ctx__said");
    if (said) said.textContent = `compacting… ${going}%`;
  }
}, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  poll();
  // The repository was left alone while the tab was away, so catch it up now
  // rather than at the end of an interval that started before you looked.
  if (selectedId && isGitTab(tab)) fetchGit(true);
});
</script>
</body>
</html>

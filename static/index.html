  .git-file__open { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: var(--md-sys-spacing-2);
    background: none; border: 0; padding: var(--md-sys-spacing-1) var(--md-sys-spacing-2);
    color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: inherit; }
  .git-file__name { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .git-file__dir { flex: 1 1 auto; min-width: 0; color: var(--md-sys-color-on-surface-variant);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .git-file__from { flex: none; color: var(--md-sys-color-on-surface-variant); }
  .git-file__xy { flex: none; width: 1.6ch; text-align: center; font-weight: 700;
    color: var(--md-sys-color-on-surface-variant); }
  .git-file[data-open="1"] { background: var(--md-sys-color-surface-container-high); }
  .git-file:hover { background: var(--md-sys-color-surface-container-high); }
  /* Hidden until the row is under the pointer or holds the focus — but never
     hidden where hover does not exist, or they could not be reached at all. */
  .git-file .scm-actions { opacity: 0; transition: opacity 90ms linear; }
  .git-file:hover .scm-actions, .git-file:focus-within .scm-actions, .git-file[data-open="1"] .scm-actions { opacity: 1; }
  @media (hover: none) { .git-file .scm-actions { opacity: 1; } }
  /* Added, modified, removed and conflicted each get a colour that is already in
     the scheme, so they follow the base colour like everything else. */
  .git-file[data-mark="A"] .git-file__xy,
  .git-file[data-mark="U"] .git-file__xy { color: var(--md-extended-color-idle-color, var(--md-sys-color-primary)); }
  .git-file[data-mark="M"] .git-file__xy,
  .git-file[data-mark="R"] .git-file__xy { color: var(--md-extended-color-waiting-color, var(--md-sys-color-tertiary)); }
  .git-file[data-mark="D"] .git-file__xy { color: var(--md-sys-color-error); }
  .git-file[data-mark="!"] .git-file__xy { color: var(--md-sys-color-error); }

  /* The diff a row opens, in place rather than in a second pane: the panel is one
     column wide and side-by-side would leave neither side readable. */
  /* Green for what arrived, red for what went — mixed from the scheme rather
     than hardcoded, because the panel's colour is generated and these have to
     move with it. The third is for a row that exists on one side only. */
  .scm-diff, .diff2 {
    --diff-add: color-mix(in srgb, var(--md-extended-color-idle-color, var(--md-sys-color-primary)) 20%, transparent);
    --diff-del: color-mix(in srgb, var(--md-sys-color-error) 18%, transparent);
    --diff-gone: color-mix(in srgb, var(--md-sys-color-on-surface) 5%, transparent);
  }
  .scm-diff {
    margin: 0 0 var(--md-sys-spacing-2) var(--md-sys-spacing-2);
    padding: var(--md-sys-spacing-3);
    max-height: 420px; overflow: auto; overscroll-behavior: contain;
    border-radius: var(--md-sys-shape-corner-small);
    border: 1px solid var(--md-sys-color-outline-variant);
    background: var(--md-sys-color-surface-container-lowest);
    white-space: pre; tab-size: 4;
  }
  /* A changed line is a tinted row, the way every editor draws one, rather than
     coloured text: the text stays the colour text is — which is what keeps it
     readable, and the contrast checks honest — and the colour says what happened
     to the line rather than having to be read as words.

     `min-width: max-content` is what makes the tint run the whole length of a
     long line instead of stopping at the edge of the box it scrolls in. */
  .scm-diff__line { display: block; min-width: max-content; }
  /* The same patch, in the conversation. Narrower, quieter, and folded until it
     is asked to open: a change is something the session did, and the chat is
     where you find out it did it — not where you read all 400 lines of it. */
  .change { margin: var(--md-sys-spacing-1) 0 var(--md-sys-spacing-2); }
  .change__bar {
    display: flex; align-items: center; gap: var(--md-sys-spacing-2);
    width: 100%; border: 0; background: none; cursor: pointer; text-align: left;
    padding: var(--md-sys-spacing-1) var(--md-sys-spacing-2);
    border-radius: var(--md-sys-shape-corner-small);
    color: var(--md-sys-color-on-surface-variant);
  }
  .change__file { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--md-sys-color-on-surface); }
  .change__stat { flex: none; }
  .change__add { color: var(--md-extended-color-idle-color, var(--md-sys-color-primary)); }
  .change__del { color: var(--md-sys-color-error); }
  .change__hint { flex: 1 1 auto; text-align: right; opacity: 0.85; }
  .change__diff { margin: 0; max-height: 420px; }
  /* Folded. The mask is what says there is more without spending a line saying
     so, and the whole block is the target: clicking anywhere in it opens it. */
  /* Folded, and — this is the part that has to be said out loud — *not a scroll
     container*. `.scm-diff` is one: it has its own overflow and its own
     `overscroll-behavior: contain`, which is right for the diff a Git row opens
     and wrong for a folded preview sitting in the middle of a conversation. A
     box that cannot scroll but has been told not to pass scrolling on is a dead
     patch of the chat: the wheel lands on it and nothing moves. `clip` clips the
     overflow without making a scroller of it, so the wheel goes straight through
     to the conversation, which is the only thing here anybody wants to scroll.
     `hidden` first, for anything that does not know `clip`, with chaining put
     back so that case degrades to merely imperfect rather than stuck. */
  .change__diff--peek { max-height: 132px; cursor: pointer;
    overflow: hidden; overflow: clip; overscroll-behavior: auto;
    -webkit-mask-image: linear-gradient(to bottom, #000 74%, transparent);
    mask-image: linear-gradient(to bottom, #000 74%, transparent); }
  /* Open, it is the editor's own layout: before on the left, after on the right,
     lines that answer each other on the same row. One grid rather than two
     scrollers, so the two sides cannot drift apart — there is nothing to keep in
     sync because there is only one thing. */
  /* The comparison has the pane, so the pane's own scroller is the only one:
     nothing here scrolls on its own, and nothing here stops the wheel and keeps
     it. One scroller was already the rule that keeps the two sides from drifting
     apart; it is also what keeps the wheel behaving like a wheel. */
  .diff2-wrap { margin: 0; }
  .diff2 {
    display: grid;
    /* Two halves of the pane rather than two columns as wide as the longest
       line: a long line wraps inside its half. A comparison you have to scroll
       sideways to read is a comparison of two things you cannot see at once,
       which is the whole point of putting them beside each other. Both cells of
       a row are cells of one grid row, so whatever wraps, the sides stay level. */
    grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr);
    tab-size: 4;
  }
  .diff2__head {
    padding: var(--md-sys-spacing-1) var(--md-sys-spacing-3);
    background: var(--md-sys-color-surface-container);
    color: var(--md-sys-color-on-surface-variant);
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }
  .diff2__head--before { grid-column: 1 / 3; }
  .diff2__head--after { grid-column: 3 / 5; border-left: 1px solid var(--md-sys-color-outline-variant); }
  /* The row is a grouping for the stylesheet, not a box: its four cells belong
     to the grid, so it lays out as if it were not there. */
  .diff2__row { display: contents; }
  .diff2__num {
    padding: 0 var(--md-sys-spacing-2); text-align: right; user-select: none;
    color: var(--md-sys-color-on-surface-variant); opacity: 0.7;
    background: inherit;
  }
  .diff2__num--after { border-left: 1px solid var(--md-sys-color-outline-variant); }
  .diff2__line { padding: 0 var(--md-sys-spacing-2);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff2__row--add .diff2__num--after, .diff2__row--add .diff2__line--after { background: var(--diff-add); }
  .diff2__row--del .diff2__num--before, .diff2__row--del .diff2__line--before { background: var(--diff-del); }
  /* A row with nothing on its side: the file simply does not have a line there,
     and a flat wash says so without pretending it is a change of its own. */
  .diff2__line--gone, .diff2__num--gone { background: var(--diff-gone); }
  /* Where the patch jumps. It is the one row that spans both sides, because the
     gap is in the file rather than in either version of it. */
  .diff2__gap {
    grid-column: 1 / 5; padding: var(--md-sys-spacing-1) var(--md-sys-spacing-3);
    color: var(--md-sys-color-primary);
    background: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);
    border-block: 1px solid var(--md-sys-color-outline-variant);
  }
  /* The comparison, with the pane to itself. The bar stays while the diff
     scrolls under it: it carries the way back, and a way back you have to scroll
     to find is one you will not find. */
  .change-full { display: flex; flex-direction: column; min-height: 100%;
    /* Out to the edges of the pane: the padding that gives a conversation its
       margins is width a comparison has better uses for. */
    margin: calc(var(--md-sys-spacing-4) * -1) calc(var(--md-sys-spacing-6) * -1)
            calc(var(--md-sys-spacing-6) * -1); }
  .change-full__bar {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: baseline; gap: var(--md-sys-spacing-2);
    padding: var(--md-sys-spacing-2) var(--md-sys-spacing-4);
    margin-bottom: var(--md-sys-spacing-2);
    background: var(--md-sys-color-surface);
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }
  .change-full__back { flex: none; }
  .change-full__back svg { width: 18px; height: 18px; }
  .change-full__name { flex: none; }
  .change-full__where { flex: 1 1 auto; min-width: 0; direction: rtl; text-align: left;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--md-sys-color-on-surface-variant); opacity: 0.8; }
  .change-full__stat { flex: none; }
  .change__note { margin: var(--md-sys-spacing-1) 0 0 var(--md-sys-spacing-2);
    color: var(--md-sys-color-on-surface-variant); }
  .scm-diff__line--add { background: var(--diff-add); }
  .scm-diff__line--del { background: var(--diff-del); }
  .scm-diff__line--hunk { color: var(--md-sys-color-primary); }
  .scm-diff__line--meta { color: var(--md-sys-color-on-surface-variant); }

  /* The graph: one lane per concurrent line of history, drawn beside the log. */
  .git-graph { display: grid; grid-template-columns: auto 1fr; }
  .git-graph__lanes { grid-column: 1; }
  /* A fixed height, because the rail beside each row is an SVG of exactly this
     many pixels: let the rows grow with their text and the lanes stop meeting
     across the join. The subject is ellipsised rather than wrapped for the same
     reason. */
  .git-commit {
    display: grid; grid-template-columns: subgrid; grid-column: 1 / -1;
    align-items: center; gap: var(--md-sys-spacing-3);
    height: 52px;
  }
  .git-commit__rail { grid-column: 1; align-self: stretch; display: block; }
  /* The separator runs under the text only. Carrying it across the rail column
     would put a 1px break through every lane, at every row. */
  .git-commit__body { grid-column: 2; min-width: 0; align-self: stretch;
    display: flex; flex-direction: column; justify-content: center;
    border-top: 1px solid var(--md-sys-color-outline-variant); }
  .git-commit__subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .git-commit__meta { color: var(--md-sys-color-on-surface-variant); display: flex; gap: 6px;
    align-items: center; flex-wrap: wrap; }
  .git-ref {
    padding: 1px 6px; border-radius: var(--md-sys-shape-corner-extra-small);
    background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
  }
  .git-ref--head { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
  .git-empty { color: var(--md-sys-color-on-surface-variant); padding: var(--md-sys-spacing-3) 0; }

  /* ================================= buttons =============================== */
  .button {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--md-sys-spacing-2);
    height: 40px; padding: 0 var(--md-sys-spacing-6);
    border: 0; border-radius: var(--md-sys-shape-corner-full);
    cursor: pointer; white-space: nowrap;
    font: var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/var(--md-sys-typescale-label-large-line-height) var(--md-sys-typescale-label-large-font);
    letter-spacing: var(--md-sys-typescale-label-large-tracking);
  }
  .button::after { content: ""; position: absolute; inset: -4px; }
  .button svg { width: 18px; height: 18px; flex: none; }
  .button--filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
  .button--tonal { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .button--text { background: transparent; color: var(--md-sys-color-primary); padding: 0 var(--md-sys-spacing-3); }
  .button--outlined { background: transparent; color: currentColor; border: 1px solid currentColor; }
  /* On the tinted detail header, the card's own pair is the only safe fill. */
  .detail-header .button--filled,
  .detail-header .button--tonal { background: var(--state-on-container); color: var(--state-container); }
  .button--danger { background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); }
  .button--danger-outlined { background: transparent; color: var(--md-sys-color-error); border: 1px solid var(--md-sys-color-error); }
  .button:disabled { opacity: 0.38; cursor: not-allowed; }
  .hint { display: flex; gap: 5px; justify-content: center; align-items: baseline; opacity: 0.85; }
  .link-button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 2px; }

  /* The gear stays lit while the settings page is the one on screen: it is a
     view you are in rather than a dialog that has come and gone. */
  .icon-button[aria-pressed="true"] {
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container);
  }

  /* ================================= switch ================================ */
  .switch { display: inline-flex; align-items: center; gap: var(--md-sys-spacing-3); cursor: pointer; user-select: none; }
  .switch__label { color: var(--md-sys-color-on-surface-variant); }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch__track {
    position: relative; width: 52px; height: 32px; flex: none;
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-surface-container-highest);
    border: 2px solid var(--md-sys-color-outline);
    transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                border-color var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .switch__thumb {
    position: absolute; top: 50%; left: 6px; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-outline);
    display: grid; place-items: center;
    transition: left var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized),
                width var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized),
                height var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized),
                background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .switch__thumb svg { width: 16px; height: 16px; opacity: 0; }
  .switch input:checked + .switch__track { background: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); }
  .switch input:checked + .switch__track .switch__thumb { left: 22px; width: 24px; height: 24px; background: var(--md-sys-color-on-primary); }
  .switch input:checked + .switch__track .switch__thumb svg { opacity: 1; stroke: var(--md-sys-color-primary); }
  .switch input:focus-visible + .switch__track { outline: 3px solid var(--md-sys-color-primary); outline-offset: 3px; }
  /* A switch whose answer no longer matters — one nested under another that has
     already said no — is dimmed rather than removed, so the setting is still
     there to find once the one above it is back on. */
  .switch:has(input:disabled) { opacity: 0.38; cursor: default; }
  /* Switches are inline so one can sit in the app bar beside the theme label.
     A run of them is a list of settings and stacks. */
  .switch-stack { display: flex; flex-direction: column; align-items: flex-start; gap: var(--md-sys-spacing-3); }
  /* The settings page is wide, and a single column of switches down the left of
     it left most of the pane empty and the page taller than the window. Both of
     these flow into as many columns as the pane can hold and collapse to one
     when it cannot hold two. */
  .settings-row, .notify-grid {
    display: grid; gap: var(--md-sys-spacing-4) var(--md-sys-spacing-6);
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  }
  .settings-row { align-items: start; }
  .settings-row > .section { margin-bottom: 0; }
  /* The swatches want a row to themselves — they wrap, and squeezed into a
     third of the pane they wrap into a block taller than the two settings
     beside them put together. */
  .settings-row__wide { grid-column: 1 / -1; }
  .settings-row { margin-bottom: var(--md-sys-spacing-6); }
  .notify-grid { align-items: start; margin-top: var(--md-sys-spacing-3); }
  /* Not small print: it is the reason none of the switches above will do
     anything, so it is drawn as the obstacle it is and carries the one button
     that clears it. */
  .notify-permission {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: var(--md-sys-spacing-3);
    margin-top: var(--md-sys-spacing-5);
    padding: var(--md-sys-spacing-4);
    border-radius: var(--md-sys-shape-corner-medium);
    background: var(--md-sys-color-surface-container-high);
  }
  /* Blocked or unsupported is a dead end rather than a step, and says so. */
  .notify-permission[data-state="denied"], .notify-permission[data-state="unsupported"] {
    background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container);
  }
  .notify-permission p { margin: 0; }
  .notify-permission[hidden] { display: none; }
  /* A sample of the notification the switch turns on, drawn as the small card
     it will arrive as. Showing the thing itself says more than a sentence
     describing when it fires, and it is the only place in the panel where you
     can see one without waiting for a session to raise it. */
  .switch__says {
    display: block; margin-top: var(--md-sys-spacing-2);
    padding: var(--md-sys-spacing-2) var(--md-sys-spacing-3);
    border-radius: var(--md-sys-shape-corner-small);
    background: var(--md-sys-color-surface-container-high);
    color: var(--md-sys-color-on-surface-variant);
  }
  .switch__says b { display: block; font-weight: 600; color: var(--md-sys-color-on-surface); }
  /* The switch is centred on a one-line label; with a sample under it the track
     belongs at the top, beside the words it is about. */
  .switch:has(.switch__says) { align-items: flex-start; }
  .switch:has(.switch__says) .switch__track { margin-top: 2px; }

  /* ============================== segmented button ========================= */
  .segmented { display: inline-flex; }
  .segmented__item {
    height: 40px; padding: 0 var(--md-sys-spacing-4);
    border: 1px solid var(--md-sys-color-outline);
    background: transparent; color: var(--md-sys-color-on-surface);
    cursor: pointer; position: relative;
    display: inline-flex; align-items: center; gap: 6px;
    font: var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/var(--md-sys-typescale-label-large-line-height) var(--md-sys-typescale-label-large-font);
  }
  .segmented__item:first-child { border-radius: var(--md-sys-shape-corner-full) 0 0 var(--md-sys-shape-corner-full); }
  .segmented__item:last-child { border-radius: 0 var(--md-sys-shape-corner-full) var(--md-sys-shape-corner-full) 0; border-left-width: 0; }
  .segmented__item:not(:first-child):not(:last-child) { border-left-width: 0; }
  .segmented__item[aria-pressed="true"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .segmented__item svg { width: 18px; height: 18px; display: none; }
  .segmented__item[aria-pressed="true"] svg { display: block; }

  /* ============================== context menu ============================= */
  /* Right-clicking a session opens this over everything, positioned at the
     pointer. Fixed, and a child of body, so a list repaint cannot tear it out. */
  .menu {
    position: fixed; z-index: 20; min-width: 232px; max-width: min(320px, 92vw);
    padding: var(--md-sys-spacing-2) 0;
    /* A short window must not put the last items out of reach — scroll instead
       of overflowing. The cap is set from innerHeight when it opens. */
    max-height: calc(100vh - 16px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--md-sys-color-surface-container);
    color: var(--md-sys-color-on-surface);
    border-radius: var(--md-sys-shape-corner-small);
    box-shadow: 0 2px 6px 2px color-mix(in srgb, var(--md-sys-color-shadow) 15%, transparent),
                0 1px 2px 0 color-mix(in srgb, var(--md-sys-color-shadow) 30%, transparent);
    opacity: 0; transform: scale(0.96); transform-origin: top left;
    transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized-decelerate);
  }
  .menu[data-open="true"] { opacity: 1; transform: scale(1); }
  /* Which session this menu belongs to — the list keeps its own selection. */
  .menu__title {
    padding: var(--md-sys-spacing-2) var(--md-sys-spacing-4) var(--md-sys-spacing-3);
    color: var(--md-sys-color-on-surface-variant);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .menu__item {
    display: flex; align-items: center; gap: var(--md-sys-spacing-3);
    width: 100%; min-height: 36px; padding: var(--md-sys-spacing-1) var(--md-sys-spacing-4);
    border: 0; background: none; color: inherit; text-align: left; cursor: pointer;
    font: inherit;
  }
  .menu__item:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px; }
  .menu__item[disabled] { color: var(--md-sys-color-on-surface-variant); opacity: 0.38; cursor: default; }
  .menu__item--danger { color: var(--md-sys-color-error); }
  .menu__icon { flex: none; display: grid; place-items: center; width: 20px; height: 20px; }
  .menu__icon svg { width: 20px; height: 20px; }
  .menu__label { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu__divider { height: 1px; margin: var(--md-sys-spacing-2) 0; border: 0;
    background: var(--md-sys-color-outline-variant); }
  /* The row — or group header — the open menu acts on, so the target is never
     in doubt. */
  .session-list li[data-menu="open"] > .session-item,
  .session-list li[data-menu="open"] > .group__header {
    outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px;
  }

  /* ========================= comments: rail and cards ====================== */
  /* Docs-style: the passage keeps its place in the transcript and the remark
     sits out in the margin, level with it. The rail is an overlay rather than a
     column so the transcript's own layout is untouched — only its right padding
     changes when the rail is up. */
  /* The card sits under the message it is about, in the flow of the conversation,
     indented from the left. The indent is what keeps it reading as a note
     attached to that message rather than another turn in the thread — which is
     the whole risk of putting it here rather than out in a margin.

     Under, not beside: a margin costs a quarter of the pane on an ordinary
     window, and every card in it has to be anchored and re-anchored against a
     scrolling column it is not part of. Here the transcript's own layout does
     the positioning, and there is nothing to keep in sync. */
  .rail { position: static; pointer-events: none; }
  .rail__inner { display: contents; }
  /* Cards sit level with their passages, so one can be behind this — it is
     pinned to the foot of the rail while they scroll past. The ring of pane
     colour is what keeps it reading as floating over them rather than jammed
     between two of them. */
  /* Pinned over the foot of the conversation rather than at the end of it: the
     cards are scattered down the transcript, so the way to send them cannot be
     parked next to any one of them. */
  .rail__send {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: var(--md-sys-spacing-3); pointer-events: auto; z-index: 4;
    box-shadow: 0 0 0 6px var(--md-sys-color-surface);
  }
  /* An MD3 outlined card: container tone and an outline, no shadow. Elevation in
     this panel is expressed as tone — shadows are kept for the scrolled app bar,
     the dialog and the snackbar, which are the things that genuinely float. */
  .ccard {
    position: relative;
    margin: var(--md-sys-spacing-2) 0 var(--md-sys-spacing-4) 40px;
    max-width: 520px;
    padding: var(--md-sys-spacing-3);
    background: var(--md-sys-color-surface-container-low);
    color: var(--md-sys-color-on-surface);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-medium);
    pointer-events: auto;
    transition: border-color var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  /* An elbow back up to the message it belongs to, so the indent reads as
     attachment rather than as a stray narrow bubble. */
  .ccard::before {
    content: ""; position: absolute; left: -20px; top: -10px; width: 18px; height: 26px;
    border-left: 2px solid var(--md-sys-color-outline-variant);
    border-bottom: 2px solid var(--md-sys-color-outline-variant);
    border-bottom-left-radius: var(--md-sys-shape-corner-small);
  }
  .ccard[data-active="true"]::before { border-color: var(--md-sys-color-primary); }
  /* A comment on one of your own messages hangs off the right, under the bubble
     it belongs to — the indent only reads as attachment when it points back at
     the side the message is on, and your messages sit at the other edge. */
  .ccard--user { align-self: flex-end; margin-inline: 0 40px; }
  .ccard--user::before {
    left: auto; right: -20px;
    border-left: 0; border-bottom-left-radius: 0;
    border-right: 2px solid var(--md-sys-color-outline-variant);
    border-bottom-right-radius: var(--md-sys-shape-corner-small);
  }
  .ccard--user[data-active="true"]::before { border-color: var(--md-sys-color-primary); }
  .ccard__label {
    margin: 0 0 var(--md-sys-spacing-2); color: var(--md-sys-color-primary);
    display: flex; align-items: center; gap: var(--md-sys-spacing-2);
  }
  .ccard__label svg { width: 16px; height: 16px; }
  .ccard[data-active="true"] { border-color: var(--md-sys-color-primary); }
  /* The message the open card belongs to, so the pair is unmistakable. */
  .msg--linked, .activity-row--linked {
    outline: 2px solid var(--md-sys-color-primary); outline-offset: 3px;
    border-radius: var(--md-sys-shape-corner-large);
  }
  .ccard__quote {
    margin: 0 0 var(--md-sys-spacing-2); padding-inline-start: var(--md-sys-spacing-2);
    border-inline-start: 2px solid var(--md-sys-color-primary);
    color: var(--md-sys-color-on-surface-variant);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* MD3 outlined text field: extra-small shape, outline at rest, a two-pixel
     primary outline while focused. */
  .ccard__field {
    width: 100%; min-height: 64px; resize: none; padding: var(--md-sys-spacing-3);
    background: transparent; color: var(--md-sys-color-on-surface);
    border: 1px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-extra-small); font: inherit;
  }
  .ccard__field::placeholder { color: var(--md-sys-color-on-surface-variant); }
  .ccard__field:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px;
    border-color: transparent; }
  .ccard__remark { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ccard__actions { display: flex; gap: var(--md-sys-spacing-1); justify-content: flex-end;
    margin-top: var(--md-sys-spacing-2); }
  /* Text buttons, the MD3 component for actions on a card — not underlined
     links. 40dp tall with the hit area taken out to 48dp, the way every other
     compact target in this panel does it. */
  .ccard__actions .button { min-height: 40px; padding-inline: var(--md-sys-spacing-3); }
  .ccard__actions .button::after {
    content: ""; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px;
  }
  /* Narrow: no room for a margin, so a card opens over the transcript instead,
     anchored to the passage it belongs to. */
  .rail[data-mode="popover"] { width: min(320px, 92vw); background: none; }
  .rail[data-mode="popover"] .ccard { position: fixed; inset-inline: auto; width: min(320px, 92vw); z-index: 21; }
  .rail[data-mode="popover"] .ccard:not([data-active="true"]) { display: none; }

  /* ============================== quote chip =============================== */
  /* Select something Claude said and this rises over it. Fixed and a child of
     body for the same reason the context menu is: the detail pane is rebuilt
     under it on any poll that changes the transcript. */
  .quote-chip {
    position: fixed; z-index: 20;
    display: flex; align-items: stretch; gap: 0;
    height: 36px; padding: 0;
    border: 0; border-radius: var(--md-sys-shape-corner-small);
    background: var(--md-sys-color-inverse-surface);
    color: var(--md-sys-color-inverse-on-surface);
    font: inherit; white-space: nowrap;
    box-shadow: 0 2px 6px 2px color-mix(in srgb, var(--md-sys-color-shadow) 15%, transparent),
                0 1px 2px 0 color-mix(in srgb, var(--md-sys-color-shadow) 30%, transparent);
    opacity: 0; transform: scale(0.92); transform-origin: bottom center;
    transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized-decelerate);
  }
  .quote-chip[data-open="true"] { opacity: 1; transform: scale(1); }
  /* State layers rather than a hand-rolled hover fill, so these behave like every
     other pressable thing in the panel. The bar reads at 40dp; the hit area is
     taken out to 48dp with a pseudo-element, the way the other compact targets
     here do it. */
  .quote-chip__act {
    position: relative; overflow: visible; isolation: isolate;
    display: flex; align-items: center; gap: var(--md-sys-spacing-2);
    padding: 0 var(--md-sys-spacing-4); border: 0; background: none; color: inherit;
    font: inherit; cursor: pointer; white-space: nowrap;
    border-radius: var(--md-sys-shape-corner-small);
  }
  .quote-chip__act::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: currentColor; opacity: 0; border-radius: inherit;
    transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .quote-chip__act:hover::before { opacity: var(--md-sys-state-hover-opacity); }
  .quote-chip__act:focus-visible::before { opacity: var(--md-sys-state-focus-opacity); }
  .quote-chip__act::after { content: ""; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
  .quote-chip__act + .quote-chip__act { box-shadow: inset 1px 0 0 0 color-mix(in srgb, currentColor 25%, transparent); }
  .quote-chip__act:focus-visible { outline: 2px solid var(--md-sys-color-inverse-primary); outline-offset: -2px; }
  .quote-chip svg { width: 18px; height: 18px; }

  /* ================================= dialog ================================ */
  .scrim {
    position: fixed; inset: 0; z-index: 10;
    background: color-mix(in srgb, var(--md-sys-color-scrim) 32%, transparent);
    display: grid; place-items: center; padding: var(--md-sys-spacing-4);
    opacity: 0; pointer-events: none;
    transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .scrim[data-open="true"] { opacity: 1; pointer-events: auto; }
  .dialog {
    width: min(560px, 100%); max-height: 90vh; overflow: auto;
    background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface);
    border-radius: var(--md-sys-shape-corner-extra-large);
    padding: var(--md-sys-spacing-6);
    transform: scale(0.9); opacity: 0;
    transition: transform var(--md-sys-motion-duration-medium4) var(--md-sys-motion-easing-emphasized-decelerate),
                opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .scrim[data-open="true"] .dialog { transform: scale(1); opacity: 1; }
  .dialog__headline { margin-bottom: var(--md-sys-spacing-2); }
  .dialog__supporting { color: var(--md-sys-color-on-surface-variant); margin-bottom: var(--md-sys-spacing-6); }
  /* Shown only by the questions that need something typed — naming a branch. */
  .dialog__field {
    width: 100%; box-sizing: border-box; height: 44px;
    margin: calc(-1 * var(--md-sys-spacing-3)) 0 var(--md-sys-spacing-6);
    padding: 0 var(--md-sys-spacing-3);
    border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-small);
    background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface);
    font: inherit;
  }
  .dialog__field:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: -1px; border-color: transparent; }
  .dialog__actions { display: flex; justify-content: flex-end; gap: var(--md-sys-spacing-2); }
  /* Keeps the last-resort action away from the one people mean to press. */
  .dialog__actions-start { margin-right: auto; color: var(--md-sys-color-on-surface-variant); }
  /* The plan report is a page of prose and bars rather than two controls. */
  .dialog--wide { width: min(640px, 100%); }

  .swatches { display: flex; flex-wrap: wrap; gap: var(--md-sys-spacing-3); align-items: center; }
  .swatch {
    width: 48px; height: 48px; flex: none; position: relative;
    border-radius: var(--md-sys-shape-corner-full);
    border: 2px solid transparent; background: var(--swatch);
    cursor: pointer; display: grid; place-items: center;
    transition: transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized);
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-pressed="true"] { border-color: var(--md-sys-color-on-surface); }
  .swatch svg { width: 22px; height: 22px; opacity: 0; stroke: var(--swatch-on); }
  .swatch[aria-pressed="true"] svg { opacity: 1; }
  .swatch--custom { background: var(--md-sys-color-surface-container-highest); overflow: hidden; }
  .swatch--custom input { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; cursor: pointer; opacity: 0; }
  .swatch--custom svg { opacity: 1; stroke: var(--md-sys-color-on-surface-variant); }
  .seed-readout { color: var(--md-sys-color-on-surface-variant); margin-top: var(--md-sys-spacing-3); }
  .code { font-family: var(--md-ref-typeface-mono); background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface); padding: 1px 6px; border-radius: var(--md-sys-shape-corner-extra-small); }

  /* ================================ snackbar =============================== */
  .snackbar {
    position: fixed; left: 50%; bottom: var(--md-sys-spacing-6); z-index: 12;
    transform: translate(-50%, calc(100% + 48px));
    display: flex; align-items: center; gap: var(--md-sys-spacing-2);
    min-height: 48px; padding: var(--md-sys-spacing-3) var(--md-sys-spacing-4);
    background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface);
    border-radius: var(--md-sys-shape-corner-extra-small);
    box-shadow: 0 4px 8px 3px color-mix(in srgb, var(--md-sys-color-shadow) 15%, transparent),
                0 1px 3px color-mix(in srgb, var(--md-sys-color-shadow) 30%, transparent);
    max-width: min(560px, calc(100vw - 32px));
    transition: transform var(--md-sys-motion-duration-long2) var(--md-sys-motion-easing-emphasized);
  }
  .snackbar[data-open="true"] { transform: translate(-50%, 0); }

  /* =============================== responsive ============================== */
  /* Compact: one pane at a time, with a back affordance — the canonical
     list-detail behaviour below 600dp. */
  @media (max-width: 899px) {
    .panes { grid-template-columns: 1fr; }

    .panes[data-view="detail"] .back-button { display: grid; }

       while keeping the 48dp target height. */

  }

<div class="app">

<script type="module">
import {
  argbFromHex, hexFromArgb, Hct, SchemeVibrant, TonalPalette,
} from "/vendor/material-color-utilities.js";

/* ==========================================================================
   Dynamic colour — one seed generates the entire scheme.
   ========================================================================== */
const DEFAULT_SEED = "#E8288F";
const SEED_PRESETS = [
  { hex: "#E8288F", name: "Pink" }, { hex: "#7C4DFF", name: "Violet" },
  { hex: "#00A18F", name: "Teal" }, { hex: "#F4511E", name: "Coral" },
  { hex: "#3D5AFE", name: "Blue" }, { hex: "#7CB342", name: "Green" },
];
const CONTRAST_LEVELS = [
  { key: "standard", label: "Standard", value: 0 },
  { key: "medium", label: "Medium", value: 0.5 },
  { key: "high", label: "High", value: 1 },
];
/* `plenty` is not a session state: it is the green a plan figure takes while
   there is still room, and it comes from here so it is hue-spaced against the
   seed and the other two like they are. Keep it last so adding it did not move
   the hues waiting and idle already had. */
const STATE_BASE_HUES = { waiting: "#FF8A00", idle: "#5B6BC0", plenty: "#12A150" };
const MIN_HUE_GAP = 35;
const MAX_CUSTOM_CHROMA = 48;

const SYS_ROLES = [
  "primary", "onPrimary", "primaryContainer", "onPrimaryContainer",
  "secondary", "onSecondary", "secondaryContainer", "onSecondaryContainer",
  "tertiary", "onTertiary", "tertiaryContainer", "onTertiaryContainer",
  "error", "onError", "errorContainer", "onErrorContainer",
  "surface", "onSurface", "onSurfaceVariant", "surfaceDim", "surfaceBright",
  "surfaceContainerLowest", "surfaceContainerLow", "surfaceContainer",
  "surfaceContainerHigh", "surfaceContainerHighest",
  "outline", "outlineVariant", "inverseSurface", "inverseOnSurface", "inversePrimary",
  "shadow", "scrim",
];
const kebab = (name) => name.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase());
const hueDistance = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

function firstFreeHue(baseHue, occupied) {
  for (let delta = 0; delta <= 180; delta += 5) {
    for (const sign of delta === 0 ? [1] : [1, -1]) {
      const candidate = (baseHue + sign * delta + 360) % 360;
      if (occupied.every((hue) => hueDistance(candidate, hue) >= MIN_HUE_GAP)) return candidate;
    }
  }
  return baseHue;
}
function customRoles(palette, dark) {
  return dark
    ? { color: palette.tone(80), onColor: palette.tone(20), container: palette.tone(30), onContainer: palette.tone(90) }
    : { color: palette.tone(40), onColor: palette.tone(100), container: palette.tone(90), onContainer: palette.tone(10) };
}

/* The four things a session can be announced for, in the order they are worth
   knowing about. Kept as a list rather than as four booleans so the page, the
   stored shape and the check in `announce` cannot drift apart.

   Each carries the notification it actually produces, because that is the
   clearest description of a notification there is: a label can only paraphrase
   when it fires, while the sample shows you the thing that will appear in the
   corner of your screen. `label` completes the sentence the heading starts. */
const NOTIFY_KINDS = [
  { key: "permission",
    label: "wants permission to use a tool",
    says: ["Claude Watchtower needs permission", "Wants to run Bash"] },
  { key: "question",
    label: "asks you a multiple-choice question",
    says: ["Claude Watchtower has a question", "Asks “Which database?”"] },
  { key: "prompt",
    label: "stops at a prompt only its own terminal can answer",
    says: ["Claude Watchtower needs you", "Waiting at its own prompt"] },
  { key: "done",
    label: "finishes a turn and goes quiet",
    says: ["Claude Watchtower is done", "Finished, and waiting at its prompt"] },
];
const allNotifying = () => Object.fromEntries(NOTIFY_KINDS.map((k) => [k.key, true]));
let settings = {
  seed: DEFAULT_SEED,
  dark: matchMedia("(prefers-color-scheme: dark)").matches,
  contrast: "standard",
  notify: allNotifying(),
};

/* localStorage is not ours alone, and a half-written value or one left by an
   older version of the panel should not take the page down on the way up: every
   one of these is read before the first paint. */
function readJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (error) {
    return fallback;
  }
}

function loadSettings() {
  const params = new URLSearchParams(location.search);
  const seed = params.get("seed") || localStorage.getItem("cbu-seed");
  if (seed && /^#[0-9a-f]{6}$/i.test(seed)) settings.seed = seed;
  const theme = params.get("theme") || localStorage.getItem("cbu-theme");
  if (theme === "dark" || theme === "light") settings.dark = theme === "dark";
  const contrast = params.get("contrast") || localStorage.getItem("cbu-contrast");
  if (CONTRAST_LEVELS.some((l) => l.key === contrast)) settings.contrast = contrast;
  // Read key by key rather than taken whole: a kind added in a later version
  // should arrive switched on rather than undefined for everyone who has
  // already saved this.
  const notify = readJson("cbu-notify", null);
  if (notify && typeof notify === "object") {
    for (const kind of NOTIFY_KINDS) {
      if (typeof notify[kind.key] === "boolean") settings.notify[kind.key] = notify[kind.key];
    }
  }
}
function persist() {
  localStorage.setItem("cbu-seed", settings.seed);
  localStorage.setItem("cbu-theme", settings.dark ? "dark" : "light");
  localStorage.setItem("cbu-contrast", settings.contrast);
  localStorage.setItem("cbu-notify", JSON.stringify(settings.notify));
}

function applyScheme() {
  const root = document.documentElement;
  const seedArgb = argbFromHex(settings.seed);
  const level = CONTRAST_LEVELS.find((l) => l.key === settings.contrast) || CONTRAST_LEVELS[0];
  const scheme = new SchemeVibrant(Hct.fromInt(seedArgb), settings.dark, level.value);
  for (const role of SYS_ROLES) {
    if (scheme[role] === undefined) continue;
    root.style.setProperty(`--md-sys-color-${kebab(role)}`, hexFromArgb(scheme[role]));
  }
  const occupied = [Hct.fromInt(scheme.primary).hue];
  for (const [name, baseHex] of Object.entries(STATE_BASE_HUES)) {
    const base = Hct.fromInt(argbFromHex(baseHex));
    const hue = firstFreeHue(base.hue, occupied);
    occupied.push(hue);
    const palette = TonalPalette.fromHueAndChroma(hue, Math.min(base.chroma, MAX_CUSTOM_CHROMA));
    for (const [role, argb] of Object.entries(customRoles(palette, settings.dark))) {
      root.style.setProperty(`--md-extended-color-${name}-${kebab(role)}`, hexFromArgb(argb));
    }
  }
  root.style.colorScheme = settings.dark ? "dark" : "light";
  root.dataset.schemeReady = "true";
  // The switch lives on the settings page, which is only sometimes on screen —
  // and the scheme can change from under it, so it follows rather than leads.
  syncTheme();
  paintFavicon();
}

/* ------------------------------------------------------------- state map */
const STATE = {
  waiting: { label: "Needs an answer", short: "answer", prefix: "--md-extended-color-waiting" },
  busy: { label: "Working", short: "working", prefix: "--md-sys-color-primary", sys: true },
  idle: { label: "Waiting", short: "waiting", prefix: "--md-extended-color-idle" },
  offline: { label: "Closed", short: "closed", prefix: null },
  // A kept session whose process has gone. Not lost, just not running.
  stopped: { label: "Stopped", short: "stopped", prefix: null },
  // The same thing, told apart because it matters: a session the panel was
  // handed. Nothing is running, which is what a panel-run session looks like
  // between turns — it is a process only while it is answering. Drawn as its own
  // state because "Stopped" made a working session read as a dead one.
  here: { label: "Runs from here", short: "here", tertiary: true },
  // Compaction is a turn like any other from the pipe's side, so on `status`
  // alone it reads as busy — and Working is the one thing it is not doing. It is
  // throwing the middle of the conversation away, which is worth knowing while
  // it happens and worth not confusing with a turn you asked for. Drawn only,
  // never a status: it is deliberately out of STATE_ORDER, so it gets no filter
  // chip and no lamp of its own, and nothing counts a compacting session twice.
  compacting: { label: "Compacting", short: "compacting", sys: true },
};
/* `shell` is not shown as a state of its own. It is what Claude Code writes on
   the way into a foreground command *and* what it leaves behind when a turn
   ends, so on screen it was a second colour for the same thing: waiting. The raw
   status still drives behaviour (a message can be queued for a shell session);
   only the display folds it in. */
const STATE_ALIAS = { shell: "idle" };
const stateKeyOf = (status) => STATE_ALIAS[status] || status;
const stateOf = (status) => STATE[stateKeyOf(status)] || STATE.idle;
/* What to draw for a session, which is not always what to reason about it with.
   An adopted session's status stays `stopped` — nothing is running, and every
   check that turns on that is still right — but calling it Stopped on screen was
   what made "make interactive" look like it had only stopped things. */
const drawnStateOf = (session) => {
  const owned = (feed.owned || {})[session.sessionId] || {};
  // Before anything else, because it is the more particular thing to say: a
  // compacting session is busy, and saying Working over it hides the one turn
  // the panel knows the subject of. See STATE.compacting.
  if (owned.compact?.running) return STATE.compacting;
  if (!owned.here) return stateOf(session.status);
  // Held and running: it is working or waiting, and says so in the ordinary
  // words — there is a process and it is doing one of those two things, which is
  // what the row is for. Held but not running: nothing is behind it yet.
  return owned.running ? stateOf(session.status) : STATE.here;
};

/* The prompt a session is standing on, whichever channel it came up on: a
   permission gate or a question the panel is holding open over its own pipe, or
   a question read out of a terminal session's transcript. One shape, because
   the row, the detail pane and the notification all want the same three facts —
   which kind it is, what to call it, and whether it is the same prompt as the
   one that was there a second ago. */
function standingAsk(session) {
  const gate = ((feed.owned || {})[session.sessionId] || {}).ask;
  if (gate) {
    const header = gate.input?.questions?.[0]?.header;
    return gate.asks
      ? { kind: "question", label: `asks “${clip(header || "a question", 40)}”`,
          key: `gate:${gate.requestId}` }
      : { kind: "permission", label: `wants to run ${clip(gate.name || "a tool", 32)}`,
          key: `gate:${gate.requestId}` };
  }
  // A terminal session's question is read out of its transcript, so there is no
  // request id to key on — the question itself is the only identity it has.
  const asked = session.question?.questions?.[0];
  if (asked) {
    const header = asked.header || asked.question || "a question";
    return { kind: "question", label: `asks “${clip(header, 40)}”`, key: `said:${clip(header, 80)}` };
  }
  // Blocked on something the panel cannot read. Which kind of prompt a terminal
  // session is standing on is not knowable from outside — Claude Code writes a
  // permission gate down nowhere — so the badge says only that there is one and
  // that it has to be answered where it was asked.
  if (stateKeyOf(session.status) === "waiting") {
    return { kind: "prompt", label: "waiting at its own prompt", key: "prompt" };
  }
  return null;
}
const ASK_WORD = { question: "question", permission: "permission", prompt: "prompt" };
const ASK_ICON = { question: "ask", permission: "gate", prompt: "ask" };

/* When the state you can see began. The server times the raw status, which
   restarts every time a waiting session dips through `shell`; on screen nothing
   happened, so the clock should not jump back to zero. */
function displaySince(session) {
  const spans = session.trace || [];
  const key = stateKeyOf(session.status);
  let since = session.statusSince;
  for (let i = spans.length - 1; i >= 0; i--) {
    if (stateKeyOf(spans[i].status) !== key) break;
    since = spans[i].from;
  }
  return since;
}
for (const entry of Object.values(STATE)) {
  if (entry.sys) {
    entry.colour = "var(--md-sys-color-primary)";
    entry.container = "var(--md-sys-color-primary-container)";
    entry.onContainer = "var(--md-sys-color-on-primary-container)";
  } else if (entry.tertiary) {
    entry.colour = "var(--md-sys-color-tertiary)";
    entry.container = "var(--md-sys-color-tertiary-container)";
    entry.onContainer = "var(--md-sys-color-on-tertiary-container)";
  } else if (entry.prefix) {
    entry.colour = `var(${entry.prefix}-color)`;
    entry.container = `var(${entry.prefix}-container)`;
    entry.onContainer = `var(${entry.prefix}-on-container)`;
  } else {
    entry.colour = "var(--md-sys-color-outline)";
    entry.container = "var(--md-sys-color-surface-container-high)";
    entry.onContainer = "var(--md-sys-color-on-surface-variant)";
  }
}
const STATE_ORDER = ["waiting", "busy", "idle", "offline", "stopped"];

/* ---------------------------------------------------------------- icons */
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  focus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M21 3l-9 9M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>',
  pair: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7 16 2-6 6-2z"/></svg>',
  power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.5-5A8 8 0 1 1 21 12z"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  // The branch, for the Git tab and the header badge on both git tabs.

/* --------------------------------------------------- coming and going ------ */
/* Everything that floats over the panel is written to fade in and out, and until
   now none of it faded out: the close paths set data-open="false" and `hidden`
   in the same breath, `hidden` is display:none, and a box that is display:none
   is not drawn — so the exit each of these was given a transition for never got
   a single frame. Things arrived gently and then blinked out of existence.

   These two keep the attribute and the transition in step. Opening flushes the
   closed style first, the way the menu already did by measuring itself between
   the two lines; closing holds the box on screen for exactly as long as the fade
   it is playing, and only then takes it out of the layout. */
const EXIT_MS = 200; /* --md-sys-motion-duration-short4 */
const exitTimers = new WeakMap();

function reveal(el) {
  if (!el) return;
  // Already open. Worth the check rather than setting it again: these are called
  // from a scroll handler, and the reflow below on every frame of a flick is a
  // measurable cost for no change at all.
  if (!el.hidden && el.dataset.open === "true") return;
  clearTimeout(exitTimers.get(el));
  exitTimers.delete(el);
  el.hidden = false;
  // A box arriving from display:none has no previous style to move from, and
  // would land open on the first frame. Reading a layout value forces the closed
  // state to be computed, which gives the transition its starting point.
  void el.offsetWidth;
  el.dataset.open = "true";
}

function conceal(el) {
  if (!el || el.hidden) return;
  // Already on its way out. Without this a scroll handler calling it every frame
  // would restart the timer every frame, and the box would sit there faded to
  // nothing but still holding its place for as long as you kept scrolling.
  if (el.dataset.open === "false") return;
  el.dataset.open = "false";
  clearTimeout(exitTimers.get(el));
  // Hidden on a timer rather than on transitionend: a box whose parent is torn
  // out mid-fade — the detail pane rebuilds under these on any poll — never
  // fires the event, and would be left behind holding its space forever.
  exitTimers.set(el, setTimeout(() => {
    el.hidden = true;
    exitTimers.delete(el);
  }, EXIT_MS));
}

/* ==========================================================================
   Grouping the index.

   Two kinds of group, and they mean different things. A *folder* group is not
   stored at all: it is what the list looks like when two or more sessions share
   a working folder, which is the shape most people's sessions already have —
   several Claudes in one repository. A group you make yourself, by picking rows
   and pressing Group, is stored, wins over the folder grouping for the rows in
   it, and keeps its own name.

   All of it is a view of the list, so it lives in this browser rather than on
   the server, the same way muting does.
   ========================================================================== */
function loadGroups() {
  try {
    const raw = JSON.parse(localStorage.getItem("cbu-groups") || "[]");
    if (!Array.isArray(raw)) return [];
    return raw
      .filter((g) => g && typeof g.id === "string" && Array.isArray(g.members))
      .map((g) => ({
        id: g.id,
        name: typeof g.name === "string" && g.name.trim() ? g.name : "Group",
        members: g.members.filter((id) => typeof id === "string"),
        collapsed: !!g.collapsed,
      }))
      .filter((g) => g.members.length);
  } catch (error) {
    return [];
  }
}
let customGroups = loadGroups();
const saveGroups = () => localStorage.setItem("cbu-groups", JSON.stringify(customGroups));

/* Folders you told the panel not to group, and groups you folded away. Both are
   keyed by the folder path, which outlives the sessions in it. */
const loadKeySet = (key) => {
  try {
    const raw = JSON.parse(localStorage.getItem(key) || "[]");
    return new Set(Array.isArray(raw) ? raw.filter((k) => typeof k === "string") : []);
  } catch (error) {
    return new Set();
  }
};
let looseFolders = loadKeySet("cbu-loose-folders");
let collapsedFolders = loadKeySet("cbu-collapsed-folders");
const saveKeySet = (key, set) => localStorage.setItem(key, JSON.stringify([...set]));

/* The rows ticked for a group action, the row a shift-click measures from, and
   the ids the list is showing in the order it draws them — which is what makes a
   shift-click select the run you can actually see. */
let picked = new Set();
let pickAnchor = null;
let visibleOrder = [];
/* The blocks the list is showing, so a menu opened from the keyboard can find
   the group its header belongs to. */
let lastBlocks = [];
/* The group whose name is being typed, so a poll cannot rebuild the list out
   from under the field. */
let renamingGroup = null;

const groupOf = (id) => customGroups.find((g) => g.members.includes(id)) || null;
const folderKeyOf = (session) => session.cwd || session.folder || "";

/* The one order rows are kept in when state is not deciding: when the session
   started, then its id so the comparison is never a tie. */
const bySessionIdentity = (a, b) =>
  (a.startedAt || 0) - (b.startedAt || 0) || (a.sessionId < b.sessionId ? -1 : a.sessionId > b.sessionId ? 1 : 0);

/* What the index draws, top to bottom: bare rows and groups, each group where
   its first member would have been. */
function listBlocks(visible) {
  const perFolder = new Map();
  for (const session of visible) {
    if (groupOf(session.sessionId)) continue;
    const key = folderKeyOf(session);
    perFolder.set(key, (perFolder.get(key) || 0) + 1);
  }
  const blocks = [];
  const open = new Map();
  for (const session of visible) {
    const custom = groupOf(session.sessionId);
    const folder = folderKeyOf(session);
    let key = null;
    if (custom) key = `custom:${custom.id}`;
    // One session in a folder is a row, not a group of one.
    else if (folder && perFolder.get(folder) > 1 && !looseFolders.has(folder)) key = `folder:${folder}`;
    if (!key) {
      blocks.push({ kind: "session", session });
      continue;
    }
    let block = open.get(key);
    if (!block) {
      block = {
        kind: "group", key, custom,
        folder: custom ? null : folder,
        name: custom ? custom.name : (session.folder || folder),
        collapsed: custom ? custom.collapsed : collapsedFolders.has(folder),
        sessions: [],
      };
      open.set(key, block);
      blocks.push(block);
    }
    block.sessions.push(session);
  }
  // A group sits where its most pressing member would have been — that is the
  // one the sorted list reached first — but inside it the rows are held in a
  // fixed order of their own, so a member going busy and idle again does not
  // shuffle the group under the pointer.
  for (const block of blocks) {
    if (block.kind === "group") block.sessions.sort(bySessionIdentity);
  }
  return blocks;
}

function toggleGroup(block) {
  if (block.custom) {
    block.custom.collapsed = !block.custom.collapsed;
    saveGroups();
  } else {
    if (collapsedFolders.has(block.folder)) collapsedFolders.delete(block.folder);
    else collapsedFolders.add(block.folder);
    saveKeySet("cbu-collapsed-folders", collapsedFolders);
  }
  render();
}

/* Picking rows. Ctrl-click ticks one, shift-click ticks the run between it and
   the last row you touched; a plain click goes back to selecting one session. */
function togglePick(id) {
  if (picked.has(id)) picked.delete(id);
  else picked.add(id);
  render();
}

function pickRange(from, to) {
  const a = visibleOrder.indexOf(from);
  const b = visibleOrder.indexOf(to);
  if (a === -1 || b === -1) return togglePick(to);
  for (const id of visibleOrder.slice(Math.min(a, b), Math.max(a, b) + 1)) picked.add(id);
  render();
}

function clearPicked(repaint = true) {
  if (!picked.size) return;
  picked.clear();
  if (repaint) render();
}

function onRowClick(id, event) {
  if (event.ctrlKey || event.metaKey) {
    togglePick(id);
    pickAnchor = id;
    return;
  }
  if (event.shiftKey) {
    pickRange(pickAnchor ?? id, id);
    pickAnchor = id;
    return;
  }
  picked.clear();
  pickAnchor = id;
  selectSession(id);
}

/* Group the picked rows. They leave whatever group they were in — a session
   belongs to one — and the new group takes the folder's name when they share
   one, because that is what you would have called it. */
function groupPicked() {
  const ids = visibleOrder.filter((id) => picked.has(id));
  if (ids.length < 2) return;
  const sessions = ids.map(sessionById).filter(Boolean);
  const folders = new Set(sessions.map((s) => s.folder).filter(Boolean));
  const name = folders.size === 1 ? [...folders][0] : `${ids.length} sessions`;
  for (const group of customGroups) group.members = group.members.filter((id) => !picked.has(id));
  customGroups = customGroups.filter((g) => g.members.length);
  customGroups.unshift({ id: `g${Date.now().toString(36)}`, name, members: ids, collapsed: false });
  saveGroups();
  picked.clear();
  showSnackbar(`Grouped ${ids.length} sessions as “${name}”`);
  render();
}

function ungroup(block) {
  if (block.custom) {
    customGroups = customGroups.filter((g) => g.id !== block.custom.id);
    saveGroups();
    showSnackbar(`“${block.name}” ungrouped`);
  } else {
    // A folder group is not stored, so leaving it apart is what gets stored.
    looseFolders.add(block.folder);
    saveKeySet("cbu-loose-folders", looseFolders);
    showSnackbar(`${block.name} is no longer grouped by folder`);
  }
  render();
}

function leaveGroup(id) {
  const group = groupOf(id);
  if (!group) return;
  group.members = group.members.filter((member) => member !== id);
  customGroups = customGroups.filter((g) => g.members.length);
  saveGroups();
  showSnackbar("Taken out of the group");
  render();
}

function regroupFolders() {
  looseFolders.clear();
  saveKeySet("cbu-loose-folders", looseFolders);
  render();
}

function syncPickBar() {
  const count = picked.size;
  pickBar.hidden = count === 0;
  pickCount.textContent = count
    ? `${count} picked${count < 2 ? " — ctrl-click another" : ""}`
    : "";
  pickGroup.disabled = count < 2;
}

/* -------------------------------------------------------------------- format */
function duration(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  if (h) return `${h}h${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}
function shorten(path, keep = 2) {
  const home = path.replace(/^\/home\/[^/]+/, "~");
  const parts = home.split("/");
  return parts.length > keep + 2 ? `${parts[0]}/…/${parts.slice(-keep).join("/")}` : home;
}
/* A one-line hint has room for a phrase, not a paragraph. Cut on the character
   rather than the path segment — a commit subject has no segments. */
function clip(text, max) {
  return text.length > max ? `${text.slice(0, max - 1).trimEnd()}…` : text;
}
function clockOf(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  return Number.isNaN(date.valueOf()) ? "" : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const selected = () => feed.sessions.find((s) => s.sessionId === selectedId) || null;

/* ------------------------------------------------------------------ markdown */
/* A transcript is Markdown, and reading it raw — literal ###, **, and fences —
   is hard work, so the bubbles render it. This is a small line-based renderer:
   headings, lists, fenced and inline code, quotes, tables, rules, emphasis and
   links, which is what a Claude answer actually uses.

   Safety: nothing from a message ever reaches the page as markup. Code is held
   aside before anything else runs, every other scrap is escaped before a tag is
   added, and a link is only made when its target is http, https or mailto. */
const MD_HOLD = "\u0000";

function safeUrl(url) {
  const value = String(url).trim();
  return /^(https?:\/\/|mailto:)[^\s"'<>]+$/i.test(value) ? value : null;
}

function renderMarkdown(text) {
  const held = [];
  const keep = (html) => `${MD_HOLD}${held.push(html) - 1}${MD_HOLD}`;
  const source = String(text ?? "").replace(/\r\n?/g, "\n");

  // Fenced code first: nothing inside a fence is Markdown. A fence inside a list
  // is indented, so the indent comes off the code and stays on the line — that is
  // what keeps the block inside its list item.
  // The info string is kept on the element rather than thrown away: quoting a
  // passage out of a code block puts the fence back, and it needs the language.
  const body = source.replace(/^([ \t]*)```([^\n]*)\n?([\s\S]*?)(?:^[ \t]*```[ \t]*$|$(?![\s\S]))/gm, (all, pad, info, code) => {
    const flat = pad ? code.replace(new RegExp(`^${pad}`, "gm"), "") : code;
    const lang = String(info || "").trim().split(/\s+/)[0].replace(/[^\w.+-]/g, "").slice(0, 24);
    return pad + keep(`<pre class="md-code"${lang ? ` data-lang="${escapeHtml(lang)}"` : ""}><code class="md-mono">${escapeHtml(flat.replace(/\n$/, ""))}</code></pre>`);
  });

  const inline = (raw) => {
    // Inline code goes the same way, so emphasis cannot reach inside it.
    let s = String(raw).replace(/`([^`\n]+)`/g, (all, code) => keep(`<code class="md-mono">${escapeHtml(code)}</code>`));
    s = escapeHtml(s);
    // An image becomes a link to it: the panel never loads a remote file.
    s = s.replace(/!\[([^\]\n]*)\]\(([^)\s]+)\)/g, (all, alt, url) => `[${alt || "image"}](${url})`);
    s = s.replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, (all, label, url) => {
      const href = safeUrl(url.replace(/&amp;/g, "&"));
      return href ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${label || escapeHtml(href)}</a>` : all;
    });
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (all, before, url) => {
      // A sentence's full stop is not part of its link.
      const trail = url.match(/[.,;:!?]+$/)?.[0] || "";
      const bare = url.slice(0, url.length - trail.length);
      const href = safeUrl(bare.replace(/&amp;/g, "&"));
      return href ? `${before}<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${bare}</a>${trail}` : all;
    });
    s = s.replace(/\*\*\*(\S(?:[^*]*\S)?)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*(\S(?:[^*]*\S)?)\*\*/g, "<strong>$1</strong>");
    // The marks have to hug the words, or `a * b * c` turns into italics.
    s = s.replace(/(^|[^*\w])\*(\S(?:[^*\n]*\S)?)\*/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^_\w])_(\S(?:[^_\n]*\S)?)_(?!\w)/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    return s.replace(/\n/g, "<br>");
  };

  const out = [];
  const stack = [];   // open lists, outermost first
  let para = [];      // lines of the paragraph being read
  let item = [];      // lines of the list item being read
  let quote = [];     // lines of the block quote being read
  let blank = false;  // was the line before this one empty?

  const flushItem = () => { if (item.length) { out.push(inline(item.join("\n"))); item = []; } };
  const flushPara = () => {
    if (stack.length) return flushItem();
    if (para.length) { out.push(`<p>${inline(para.join("\n"))}</p>`); para = []; }
  };
  const flushQuote = () => {
    if (!quote.length) return;
    out.push(`<blockquote>${inline(quote.join("\n"))}</blockquote>`);
    quote = [];
  };
  const closeLists = (indent) => {
    flushItem();
    while (stack.length && stack[stack.length - 1].indent >= indent) {
      const list = stack.pop();
      out.push(`</li></${list.tag}>`);
    }
  };
  const closeAll = () => { flushQuote(); flushPara(); closeLists(0); };
  const add = (line) => (stack.length ? item : para).push(line);

  const lines = body.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const bare = line.trim();

    if (!bare) { flushQuote(); flushItem(); if (!stack.length) flushPara(); blank = true; continue; }

    // A blank line then something flush with the margin is the end of the list;
    // indent the same thing instead and it stays inside the item. The next
    // bullet, of course, carries the list on.
    const startsItem = /^\s*([-*+]|\d+[.)])\s+/.test(line);
    if (blank && stack.length && !startsItem && !/^\s{2,}/.test(line)) closeLists(0);
    blank = false;

    if (bare.startsWith(">")) { flushPara(); flushItem(); quote.push(bare.replace(/^>\s?/, "")); continue; }
    flushQuote();

    // A held code block stands on its own line; inside a list it belongs to the item.
    const only = bare.match(new RegExp(`^${MD_HOLD}(\\d+)${MD_HOLD}$`));
    if (only) { flushItem(); if (!stack.length) flushPara(); out.push(held[Number(only[1])]); continue; }

    const heading = bare.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      closeAll();
      const level = Math.min(heading[1].length + 2, 6);
      const size = heading[1].length <= 2 ? "md-title-medium" : "md-title-small";
      out.push(`<h${level} class="md-head ${size}">${inline(heading[2])}</h${level}>`);
      continue;
    }

    if (/^([-*_])\1{2,}$/.test(bare)) { closeAll(); out.push("<hr>"); continue; }

    // A table needs its header underline on the next line to count as one.
    if (bare.startsWith("|") && /^\|?[\s:|-]+\|[\s:|-]*$/.test((lines[i + 1] || "").trim()) && (lines[i + 1] || "").includes("-")) {
      closeAll();
      const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const head = cells(bare);
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      i--;
      out.push(`<table class="md-table"><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>`
        + `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }

    const bullet = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (bullet) {
      const indent = bullet[1].length;
      const tag = /\d/.test(bullet[2]) ? "ol" : "ul";
      flushPara();
      flushItem();
      while (stack.length && stack[stack.length - 1].indent > indent) {
        const list = stack.pop();
        out.push(`</li></${list.tag}>`);
      }
      const top = stack[stack.length - 1];
      if (top && top.indent === indent && top.tag === tag) {
        out.push("</li><li>");
      } else {
        if (top && top.indent === indent) { stack.pop(); out.push(`</li></${top.tag}>`); }
        stack.push({ tag, indent });
        out.push(`<${tag}><li>`);
      }
      // A task list reads better as a box than as literal brackets.
      item = [bullet[3].replace(/^\[([ xX])\]\s+/, (all, mark) => (mark === " " ? "☐ " : "☑ "))];
      continue;
    }

    // Not a list line at all: an unindented one ends the list.
    if (stack.length && !/^\s{2,}/.test(line)) { closeLists(0); flushItem(); }
    add(bare);
  }
  closeAll();

  return out.join("").replace(new RegExp(`${MD_HOLD}(\\d+)${MD_HOLD}`, "g"), (all, n) => held[Number(n)]);
}

/* ------------------------------------------------------------------ transport */
async function poll() {
  try {
    const response = await fetch("/api/state", { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    const data = await response.json();
    skew = data.now - Date.now() / 1000;
    feed = data;
    lastGood = Date.now();
    announce(data.sessions);
    render();
    if (selectedId && (transcriptFor !== selectedId || tab === "chat")) fetchTranscript();
    if (selectedId && isGitTab(tab)) fetchGit();
    if (selectedId && tab === "usage") fetchUsage();
  } catch (error) {
    barSupporting.textContent = "lost the server — retrying";
    // The counts on screen are stale, so a nudge based on them is a guess.
    barNudge.hidden = true;
  }
}

async function fetchTranscript() {
  const id = selectedId;
  if (!id || transcriptBusy) return;
  if (tab !== "chat" && transcriptFor === id) return;
  transcriptBusy = true;
  try {
    const asked = chatLimit;
    const response = await fetch(`/api/transcript?sessionId=${encodeURIComponent(id)}&limit=${asked}`, { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    const data = await response.json();
    if (selectedId !== id) return;             // selection moved on while fetching
    // Enough of the transcript to notice a new message, or the last one growing.
    // Rebuilding on every poll instead — which "always redraw the chat tab" came
    // down to — throws the pane away a second at a time, under the pointer.
    const stamp = (t) => {
      const last = t?.messages?.[t.messages.length - 1];
      return [t?.title ?? "", t?.messages?.length ?? -1, last?.at ?? "",
              last?.text?.length ?? 0, last?.tools?.length ?? 0].join("|");
    };
    const changed = stamp(data) !== stamp(transcript) || transcriptFor !== id;
    transcript = data;
    transcriptFor = id;
    if (changed) renderDetail(true);
  } catch (error) {
    /* leave the previous transcript on screen */
  } finally {
    transcriptBusy = false;
  }
}

/* Another page of the conversation. The reading itself is the server's — this
   only raises what is asked for, and marks the re-render as a growth so the pane
   holds its place. A fetch already in flight is not waited on: the chat tab
   re-fetches on the next poll a moment later, now at the larger limit. */
function showMoreChat(event) {
  const button = event.currentTarget;
  if (chatLimit >= CHAT_LIMIT_MAX) return;
  chatLimit = Math.min(CHAT_LIMIT_MAX, chatLimit + CHAT_PAGE);
  chatGrew = true;
  button.disabled = true;
  button.textContent = "reading…";
  fetchTranscript();
}

/* Reading a repository costs a subprocess or three, unlike the transcript's file
   read, so this runs on its own much slower clock rather than on every poll.

   Slow on purpose. A working tree does not change on its own — a session or you
   changes it — and everything the panel itself does re-reads immediately, as does
   opening the tab or switching session. So this interval only governs how long a
   change made *elsewhere* takes to show up, which is worth far less than running
   git against somebody's repository every couple of seconds all day. */
let gitPolledAt = 0;
const GIT_POLL_MS = 20000;

/* Everything the Git tab draws, in one string. Same reasoning as the
   transcript's: re-rendering on every poll throws the pane away under the
   pointer, so the panel only redraws when the repository actually moved. */
/* Both git tabs are drawn from the same reading, so they fetch and fall back
   together. */
const isGitTab = (name) => name === "git" || name === "history";

function gitStamp(g) {
  // upstream belongs here: publishing a branch changes nothing else about the
  // repository, and without it the header would go on saying "no upstream".
  return [g?.ok, g?.isRepo, g?.canWrite, g?.head ?? "", g?.branch ?? "", g?.upstream ?? "",
          g?.detached, g?.ahead ?? 0, g?.behind ?? 0,
          g?.stashes ?? 0, g?.commits?.[0]?.sha ?? "", g?.commits?.length ?? -1,
          // The branch menu is built when it opens, from whatever this holds, so a
          // branch appearing or going has to reach the pane.
          (g?.branches?.local ?? []).map((b) => `${b.name}${b.current ? "*" : ""}`).join(","),
          (g?.branches?.remote ?? []).map((b) => b.name).join(","),
          // Each side keeps its own column, filled with a dot when it is empty.
          // Run them together and staging a modified file reads the same either
          // way — "M" and "M" — so the pane would never notice it had moved.
          (g?.files ?? []).map((f) =>
            `${f.path}:${f.staged ?? "."}${f.unstaged ?? "."}${f.untracked ? "?" : ""}${f.conflicted ? "!" : ""}`
          ).join(",")].join("|");
}

async function fetchGit(force) {
  const id = selectedId;
  if (!id || gitBusy) return;
  // Nobody is reading a hidden tab. A Git tab left open behind another window
  // would otherwise go on running git for the rest of the day; coming back to it
  // reads once, immediately.
  if (!force && document.hidden) return;
  if (!force && gitFor === id && Date.now() - gitPolledAt < GIT_POLL_MS) return;
  gitBusy = true;
  gitPolledAt = Date.now();
  try {
    const response = await fetch(`/api/git?sessionId=${encodeURIComponent(id)}`, { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    const data = await response.json();
    if (selectedId !== id) return;             // selection moved on while fetching
    const changed = gitStamp(data) !== gitStamp(git) || gitFor !== id;
    git = data;
    gitFor = id;
    if (changed) {
      renderDetail(true);
      // An open diff describes a file that has just moved, so it is read again
      // rather than left showing what the file used to say.
      if (diffOpen) fetchDiff();
    }
  } catch (error) {
    /* leave the previous reading on screen */
  } finally {
    gitBusy = false;
  }
}

/* Tokens and cost. Cheaper to read than the repository — the server scans the
   transcript once and picks up where it stopped — but there is no point reading
   it while another tab is showing, so it runs on the poll only when its own tab
   is up, and once immediately when you open it. */
function usageStamp(u) {
  return [u?.cost ?? -1, u?.totals?.requests ?? -1, u?.context ?? -1,
          (u?.models ?? []).length, (u?.agentModels ?? []).length].join("|");
}

async function fetchUsage(force) {
  const id = selectedId;
  if (!id || usageBusy) return;
  if (!force && document.hidden) return;
  usageBusy = true;
  try {
    const response = await fetch(`/api/usage?sessionId=${encodeURIComponent(id)}`, { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    const data = await response.json();
    if (selectedId !== id) return;             // selection moved on while fetching
    const changed = usageStamp(data) !== usageStamp(usage) || usageFor !== id;
    usage = data;
    usageFor = id;
    if (changed) renderDetail(true);
  } catch (error) {
    /* leave the previous reading on screen */
  } finally {
    usageBusy = false;
  }
}

/* ------------------------------------------------- git: opening and acting */

function closeDiff() {
  diffOpen = null;
  diffText = null;
  diffNote = "";
}

/* Clicking a row shows its diff under it, and clicking the same row again puts
   it away — one open at a time, because the pane is one column wide. */
function toggleDiff(path, staged) {
  if (diffOpen && diffOpen.path === path && diffOpen.staged === staged) {
    closeDiff();
    renderDetail(true);
    return;
  }
  diffOpen = { path, staged };
  diffText = null;
  diffNote = "";
  renderDetail(true);
  fetchDiff();
}

async function fetchDiff() {
  const id = selectedId;
  const want = diffOpen;
  if (!id || !want) return;
  const query = new URLSearchParams({ sessionId: id, path: want.path, staged: want.staged ? "1" : "0" });
  try {

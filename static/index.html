<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Claude sessions</title>
<style>
  /* ==========================================================================
     Material Design 3 reference tokens.
     Every --md-sys-color-* value is generated at runtime from the seed colour
     by material-color-utilities, so no colour is hardcoded below this block.
     ========================================================================== */
  @font-face {
    font-family: "Roboto";
    src: url("/fonts/Roboto.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Roboto Mono";
    src: url("/fonts/RobotoMono.woff2") format("woff2");
    font-weight: 100 700;
    font-display: swap;
  }

  :root {
    /* --- md.ref.typeface --- */
    --md-ref-typeface-brand: "Roboto", system-ui, sans-serif;
    --md-ref-typeface-plain: "Roboto", system-ui, sans-serif;
    --md-ref-typeface-mono: "Roboto Mono", ui-monospace, monospace;

    /* --- md.sys.shape.corner --- */
    --md-sys-shape-corner-none: 0;
    --md-sys-shape-corner-extra-small: 4px;
    --md-sys-shape-corner-small: 8px;
    --md-sys-shape-corner-medium: 12px;
    --md-sys-shape-corner-large: 16px;
    --md-sys-shape-corner-large-increased: 20px;
    --md-sys-shape-corner-extra-large: 28px;
    --md-sys-shape-corner-extra-large-increased: 32px;
    --md-sys-shape-corner-full: 9999px;

    /* --- md.sys.motion --- */
    --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
    --md-sys-motion-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
    --md-sys-motion-easing-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
    --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
    --md-sys-motion-duration-short4: 200ms;
    --md-sys-motion-duration-medium2: 300ms;
    --md-sys-motion-duration-medium4: 400ms;
    --md-sys-motion-duration-long2: 500ms;

    /* --- md.sys.typescale (baseline scale, sp/16 = rem) --- */
    --md-sys-typescale-display-small-font: var(--md-ref-typeface-brand);
    --md-sys-typescale-display-small-weight: 400;
    --md-sys-typescale-display-small-size: 2.25rem;
    --md-sys-typescale-display-small-line-height: 2.75rem;
    --md-sys-typescale-display-small-tracking: 0;

    --md-sys-typescale-headline-small-font: var(--md-ref-typeface-brand);
    --md-sys-typescale-headline-small-weight: 400;
    --md-sys-typescale-headline-small-size: 1.5rem;
    --md-sys-typescale-headline-small-line-height: 2rem;
    --md-sys-typescale-headline-small-tracking: 0;

    --md-sys-typescale-title-large-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-title-large-weight: 400;
    --md-sys-typescale-title-large-size: 1.375rem;
    --md-sys-typescale-title-large-line-height: 1.75rem;
    --md-sys-typescale-title-large-tracking: 0;

    --md-sys-typescale-title-medium-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-title-medium-weight: 500;
    --md-sys-typescale-title-medium-size: 1rem;
    --md-sys-typescale-title-medium-line-height: 1.5rem;
    --md-sys-typescale-title-medium-tracking: 0.009375rem;

    --md-sys-typescale-title-small-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-title-small-weight: 500;
    --md-sys-typescale-title-small-size: 0.875rem;
    --md-sys-typescale-title-small-line-height: 1.25rem;
    --md-sys-typescale-title-small-tracking: 0.00625rem;

    --md-sys-typescale-body-large-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-body-large-weight: 400;
    --md-sys-typescale-body-large-size: 1rem;
    --md-sys-typescale-body-large-line-height: 1.5rem;
    --md-sys-typescale-body-large-tracking: 0.03125rem;

    --md-sys-typescale-body-medium-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-body-medium-weight: 400;
    --md-sys-typescale-body-medium-size: 0.875rem;
    --md-sys-typescale-body-medium-line-height: 1.25rem;
    --md-sys-typescale-body-medium-tracking: 0.015625rem;

    --md-sys-typescale-body-small-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-body-small-weight: 400;
    --md-sys-typescale-body-small-size: 0.75rem;
    --md-sys-typescale-body-small-line-height: 1rem;
    --md-sys-typescale-body-small-tracking: 0.025rem;

    --md-sys-typescale-label-large-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-label-large-weight: 500;
    --md-sys-typescale-label-large-size: 0.875rem;
    --md-sys-typescale-label-large-line-height: 1.25rem;
    --md-sys-typescale-label-large-tracking: 0.00625rem;

    --md-sys-typescale-label-medium-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-label-medium-weight: 500;
    --md-sys-typescale-label-medium-size: 0.75rem;
    --md-sys-typescale-label-medium-line-height: 1rem;
    --md-sys-typescale-label-medium-tracking: 0.03125rem;

    --md-sys-typescale-label-small-font: var(--md-ref-typeface-plain);
    --md-sys-typescale-label-small-weight: 500;
    --md-sys-typescale-label-small-size: 0.6875rem;
    --md-sys-typescale-label-small-line-height: 1rem;
    --md-sys-typescale-label-small-tracking: 0.03125rem;

    /* --- md.sys.state layer opacities --- */
    --md-sys-state-hover-opacity: 0.08;
    --md-sys-state-focus-opacity: 0.10;
    --md-sys-state-pressed-opacity: 0.10;
    --md-sys-state-dragged-opacity: 0.16;

    /* --- md.sys.spacing (8dp system) --- */
    --md-sys-spacing-1: 4px;
    --md-sys-spacing-2: 8px;
    --md-sys-spacing-3: 12px;
    --md-sys-spacing-4: 16px;
    --md-sys-spacing-5: 20px;
    --md-sys-spacing-6: 24px;
  }

  /* ============================== typescale utilities ====================== */
  .md-display-small, .md-headline-small, .md-title-large, .md-title-medium,
  .md-title-small, .md-body-large, .md-body-medium, .md-body-small,
  .md-label-large, .md-label-medium, .md-label-small { margin: 0; }

  .md-display-small {
    font: var(--md-sys-typescale-display-small-weight) var(--md-sys-typescale-display-small-size)/var(--md-sys-typescale-display-small-line-height) var(--md-sys-typescale-display-small-font);
    letter-spacing: var(--md-sys-typescale-display-small-tracking);
  }
  .md-headline-small {
    font: var(--md-sys-typescale-headline-small-weight) var(--md-sys-typescale-headline-small-size)/var(--md-sys-typescale-headline-small-line-height) var(--md-sys-typescale-headline-small-font);
    letter-spacing: var(--md-sys-typescale-headline-small-tracking);
  }
  .md-title-large {
    font: var(--md-sys-typescale-title-large-weight) var(--md-sys-typescale-title-large-size)/var(--md-sys-typescale-title-large-line-height) var(--md-sys-typescale-title-large-font);
    letter-spacing: var(--md-sys-typescale-title-large-tracking);
  }
  .md-title-medium {
    font: var(--md-sys-typescale-title-medium-weight) var(--md-sys-typescale-title-medium-size)/var(--md-sys-typescale-title-medium-line-height) var(--md-sys-typescale-title-medium-font);
    letter-spacing: var(--md-sys-typescale-title-medium-tracking);
  }
  .md-title-small {
    font: var(--md-sys-typescale-title-small-weight) var(--md-sys-typescale-title-small-size)/var(--md-sys-typescale-title-small-line-height) var(--md-sys-typescale-title-small-font);
    letter-spacing: var(--md-sys-typescale-title-small-tracking);
  }
  .md-body-large {
    font: var(--md-sys-typescale-body-large-weight) var(--md-sys-typescale-body-large-size)/var(--md-sys-typescale-body-large-line-height) var(--md-sys-typescale-body-large-font);
    letter-spacing: var(--md-sys-typescale-body-large-tracking);
  }
  .md-body-medium {
    font: var(--md-sys-typescale-body-medium-weight) var(--md-sys-typescale-body-medium-size)/var(--md-sys-typescale-body-medium-line-height) var(--md-sys-typescale-body-medium-font);
    letter-spacing: var(--md-sys-typescale-body-medium-tracking);
  }
  .md-body-small {
    font: var(--md-sys-typescale-body-small-weight) var(--md-sys-typescale-body-small-size)/var(--md-sys-typescale-body-small-line-height) var(--md-sys-typescale-body-small-font);
    letter-spacing: var(--md-sys-typescale-body-small-tracking);
  }
  .md-label-large {
    font: var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/var(--md-sys-typescale-label-large-line-height) var(--md-sys-typescale-label-large-font);
    letter-spacing: var(--md-sys-typescale-label-large-tracking);
  }
  .md-label-medium {
    font: var(--md-sys-typescale-label-medium-weight) var(--md-sys-typescale-label-medium-size)/var(--md-sys-typescale-label-medium-line-height) var(--md-sys-typescale-label-medium-font);
    letter-spacing: var(--md-sys-typescale-label-medium-tracking);
  }
  .md-label-small {
    font: var(--md-sys-typescale-label-small-weight) var(--md-sys-typescale-label-small-size)/var(--md-sys-typescale-label-small-line-height) var(--md-sys-typescale-label-small-font);
    letter-spacing: var(--md-sys-typescale-label-small-tracking);
  }
  .md-mono { font-family: var(--md-ref-typeface-mono); font-variant-numeric: tabular-nums; }

  /* ================================== base ================================= */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* The scheme is generated in JS, so hold the first paint until the tokens
     exist rather than flashing an unthemed page. */
  html:not([data-scheme-ready]) body { visibility: hidden; }
  body {
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    font: var(--md-sys-typescale-body-medium-weight) var(--md-sys-typescale-body-medium-size)/var(--md-sys-typescale-body-medium-line-height) var(--md-sys-typescale-body-medium-font);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background var(--md-sys-motion-duration-medium2) var(--md-sys-motion-easing-standard);
  }
  :focus-visible {
    outline: 3px solid var(--md-sys-color-primary);
    outline-offset: 2px;
    border-radius: var(--md-sys-shape-corner-extra-small);
  }

  /* Material 3 state layer: a tinted overlay, never an opacity change */
  .md-state { position: relative; overflow: hidden; isolation: isolate; }
  .md-state::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: currentColor; opacity: 0;
    transition: opacity 120ms var(--md-sys-motion-easing-standard);
  }
  .md-state:hover::before { opacity: var(--md-sys-state-hover-opacity); }
  .md-state:focus-visible::before { opacity: var(--md-sys-state-focus-opacity); }
  .md-state:active::before { opacity: var(--md-sys-state-pressed-opacity); }
  .md-ripple {
    position: absolute; border-radius: var(--md-sys-shape-corner-full); transform: scale(0); z-index: -1;
    background: currentColor; opacity: 0.16; pointer-events: none;
    animation: md-ripple var(--md-sys-motion-duration-medium4) var(--md-sys-motion-easing-standard) forwards;
  }
  @keyframes md-ripple { to { transform: scale(2.5); opacity: 0; } }

  /* ============================== app shell ================================ */
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  .app-bar {
    display: flex; align-items: center; gap: var(--md-sys-spacing-2);
    height: 64px; flex: none; padding: 0 var(--md-sys-spacing-4);
    background: var(--md-sys-color-surface-container);
    color: var(--md-sys-color-on-surface);
  }
  .app-bar__headline { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: var(--md-sys-spacing-3); }
  .app-bar__title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-bar__supporting { color: var(--md-sys-color-on-surface-variant); white-space: nowrap; }
  .app-bar__actions { display: flex; align-items: center; gap: var(--md-sys-spacing-2); flex: none; }

  .icon-button {
    width: 40px; height: 40px; flex: none; position: relative;
    display: grid; place-items: center;
    border: 0; border-radius: var(--md-sys-shape-corner-full);
    background: transparent; color: var(--md-sys-color-on-surface-variant);
    cursor: pointer;
  }
  .icon-button::after { content: ""; position: absolute; inset: -4px; }
  .icon-button svg { width: 24px; height: 24px; }

  /* Canonical list-detail: the list is a pane, not a page. */
  .panes { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
  .list-pane {
    min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    background: var(--md-sys-color-surface-container-low);
    border-right: 1px solid var(--md-sys-color-outline-variant);
    padding-bottom: var(--md-sys-spacing-4);
  }
  /* The header and tabs stay put; only the panel below them scrolls. */
  .detail-pane { min-height: 0; overflow: hidden; background: var(--md-sys-color-surface); display: flex; flex-direction: column; }

  /* ============================== filter chips ============================= */
  /* The chips and the selection bar ride together at the top of the index, so a
     bar that appears while you pick rows does not push the chips out of reach. */
  .list-sticky {
    position: sticky; top: 0; z-index: 2;
    background: var(--md-sys-color-surface-container-low);
  }
  .chip-set {
    display: flex; flex-wrap: wrap; gap: var(--md-sys-spacing-2);
    margin: 0; padding: var(--md-sys-spacing-3) var(--md-sys-spacing-4); list-style: none;
  }
  .chip {
    position: relative;
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 var(--md-sys-spacing-3);
    border-radius: var(--md-sys-shape-corner-small);
    border: 1px solid var(--md-sys-color-outline-variant);
    background: transparent; color: var(--md-sys-color-on-surface-variant);
    cursor: pointer;
    transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                color var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                border-color var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .chip::after { content: ""; position: absolute; inset: -8px 0; }
  .chip[aria-pressed="true"] {
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container);
    border-color: transparent;
  }
  .chip__dot { width: 9px; height: 9px; border-radius: var(--md-sys-shape-corner-full); background: var(--chip-dot, currentColor); flex: none; }
  .chip__check { width: 16px; height: 16px; display: none; }
  .chip[aria-pressed="true"] .chip__check { display: block; }
  .chip[aria-pressed="true"] .chip__dot { display: none; }

  /* ============================== session list ============================= */
  .session-list { list-style: none; margin: 0; padding: 0 var(--md-sys-spacing-2); display: flex; flex-direction: column; gap: 2px; }
  .session-item {
    /* Navigation-drawer item anatomy: pill shape, 56dp+, active = secondary. */
    width: 100%; text-align: left; cursor: pointer; border: 0;
    /* A shift-click picks a run of rows; without this it also drags a selection
       across their text. */
    user-select: none;
    display: flex; align-items: center; gap: var(--md-sys-spacing-3);
    padding: var(--md-sys-spacing-2) var(--md-sys-spacing-3);
    border-radius: var(--md-sys-shape-corner-full);
    background: transparent; color: var(--md-sys-color-on-surface-variant);
    transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                color var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .session-item[aria-current="true"] {
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container);
  }
  /* The avatar says two things at once: which host, and which state. */
  .session-item__avatar {
    width: 40px; height: 40px; flex: none;
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--state-container); color: var(--state-on-container);
    display: grid; place-items: center; position: relative;
  }
  .session-item__avatar svg { width: 20px; height: 20px; }
  .session-item__lamp {
    position: absolute; right: -1px; bottom: -1px;
    width: 12px; height: 12px; border-radius: var(--md-sys-shape-corner-full);
    background: var(--state-colour);
    box-shadow: 0 0 0 2px var(--md-sys-color-surface-container-low);
  }
  .session-item[aria-current="true"] .session-item__lamp { box-shadow: 0 0 0 2px var(--md-sys-color-secondary-container); }
  .session-item[data-status="busy"] .session-item__lamp { animation: lamp-throb 1.6s var(--md-sys-motion-easing-standard) infinite; }
  .session-item[data-status="waiting"] .session-item__lamp { animation: lamp-flash 1.1s var(--md-sys-motion-easing-standard) infinite; }
  @keyframes lamp-throb { 0%, 100% { box-shadow: 0 0 0 2px var(--md-sys-color-surface-container-low); } 70% { box-shadow: 0 0 0 2px var(--md-sys-color-surface-container-low), 0 0 0 8px transparent; } }
  @keyframes lamp-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* A column, so a name you typed yourself is cut to the row rather than
     running under the clock on the right. */
  .session-item__text { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
  .session-item__headline { display: block; min-width: 0; color: var(--md-sys-color-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item[aria-current="true"] .session-item__headline { color: var(--md-sys-color-on-secondary-container); }
  .session-item__pin svg { width: 13px; height: 13px; vertical-align: -1px; margin-inline-end: 4px; opacity: 0.75; }
  .session-item__supporting { display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item__trailing { flex: none; text-align: right; }

  .list-empty { padding: var(--md-sys-spacing-6) var(--md-sys-spacing-4); color: var(--md-sys-color-on-surface-variant); text-align: center; }

  /* ============================== groups =================================== */
  /* Sessions that belong together — the same folder by default, or a grouping
     you made yourself — sit under a header that folds them away. */
  .group { display: flex; flex-direction: column; gap: 2px; margin-top: var(--md-sys-spacing-1); }
  .group__header {
    width: 100%; display: flex; align-items: center; gap: var(--md-sys-spacing-2);
    padding: var(--md-sys-spacing-2) var(--md-sys-spacing-3);
    border: 0; border-radius: var(--md-sys-shape-corner-full);
    background: transparent; color: var(--md-sys-color-on-surface-variant);
    text-align: left; cursor: pointer; font: inherit;
  }
  .group__chevron { flex: none; display: grid; place-items: center; width: 20px; height: 20px;
    transition: transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard); }
  .group__chevron svg { width: 18px; height: 18px; }
  .group[data-collapsed="true"] .group__chevron { transform: rotate(-90deg); }
  /* Which kind of group this is: a folder, or one you put together yourself. */
  .group__icon { flex: none; display: grid; place-items: center; width: 18px; height: 18px; opacity: 0.75; }
  .group__icon svg { width: 16px; height: 16px; }
  .group__name { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* A folded group still has to say what is inside it: one dot per state its
     sessions are in, so a group hiding something that needs an answer shows it. */
  .group__lamps { flex: none; display: flex; gap: 3px; }
  .group__lamp { width: 8px; height: 8px; border-radius: var(--md-sys-shape-corner-full); background: var(--lamp); }
  .group__count { flex: none; opacity: 0.85; min-width: 2ch; text-align: right; }
  .group__items {
    list-style: none; margin: 0 0 0 var(--md-sys-spacing-4); padding: 0 0 0 var(--md-sys-spacing-2);
    display: flex; flex-direction: column; gap: 2px;
    border-inline-start: 1px solid var(--md-sys-color-outline-variant);
  }
  .group[data-collapsed="true"] .group__items { display: none; }
  /* A name being typed into the header, in the same place the name was. */
  .group__field {
    flex: 1 1 auto; min-width: 0;
    padding: 0 var(--md-sys-spacing-2);
    background: color-mix(in srgb, currentColor 10%, transparent);
    border: 0; border-bottom: 2px solid currentColor;
    border-radius: var(--md-sys-shape-corner-extra-small);
    color: inherit; font: inherit; letter-spacing: inherit; outline: none;
  }

  /* ========================== picking several rows ========================== */
  /* Ctrl-click or shift-click ticks rows for a group action. Picked is primary,
     which is nothing else in the list, so it never reads as the selection. */
  .session-item[data-picked="true"] {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
  }
  .session-item[data-picked="true"] .session-item__headline { color: var(--md-sys-color-on-primary-container); }
  .session-item[data-picked="true"] .session-item__lamp { box-shadow: 0 0 0 2px var(--md-sys-color-primary-container); }
  /* The row you are also looking at keeps its ring, so both facts stay readable. */
  .session-item[data-picked="true"][aria-current="true"] {
    outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px;
  }
  /* A group holding picked rows, which matters most when it is folded over them. */
  .group[data-picked] > .group__header { color: var(--md-sys-color-primary); }
  .pick-bar {
    display: flex; align-items: center; gap: var(--md-sys-spacing-2);
    padding: 0 var(--md-sys-spacing-4) var(--md-sys-spacing-3);
  }
  .pick-bar[hidden] { display: none; }
  .pick-bar__count { flex: 1 1 auto; min-width: 0; color: var(--md-sys-color-on-surface-variant); }
  .pick-bar .button { height: 32px; padding: 0 var(--md-sys-spacing-3); }

  /* ================================ detail ================================= */
  .detail-empty { flex: 1 1 auto; display: grid; place-items: center; padding: var(--md-sys-spacing-6); text-align: center; color: var(--md-sys-color-on-surface-variant); }

  .detail-header {
    flex: none; padding: var(--md-sys-spacing-6) var(--md-sys-spacing-6) var(--md-sys-spacing-4);
    background: var(--state-container); color: var(--state-on-container);
  }
  .detail-header__top { display: flex; align-items: flex-start; gap: var(--md-sys-spacing-4); }
  .detail-header__text { flex: 1 1 auto; min-width: 0; }
  .detail-header__title { display: flex; align-items: center; gap: var(--md-sys-spacing-2); flex-wrap: wrap; }
  .detail-header__subtitle { opacity: 0.85; margin-top: 2px; }
  /* The title doubles as the rename control: a click turns it into a field. */
  .name-button {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 0; padding: 2px var(--md-sys-spacing-2); margin-inline-start: -8px;
    border-radius: var(--md-sys-shape-corner-small);
    color: inherit; font: inherit; letter-spacing: inherit; text-align: left; cursor: text;
  }
  .name-button > span { overflow-wrap: anywhere; }
  .name-button svg { width: 16px; height: 16px; flex: none; opacity: 0; transition: opacity 120ms; }
  .name-button:hover svg, .name-button:focus-visible svg { opacity: 0.7; }
  .name-field {
    /* Sized to the text by startRename, so the state beside it keeps its place. */
    min-width: 0; flex: 0 1 auto; max-width: 100%;
    padding: 2px var(--md-sys-spacing-2); margin-inline-start: -8px;
    background: color-mix(in srgb, var(--state-on-container) 10%, transparent);
    border: 0; border-bottom: 2px solid currentColor; border-radius: var(--md-sys-shape-corner-small);
    color: inherit; font: inherit; letter-spacing: inherit; outline: none;
  }
  .detail-header__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--md-sys-spacing-1) var(--md-sys-spacing-2); margin-top: var(--md-sys-spacing-3); opacity: 0.9; }
  .detail-header__actions { flex: none; display: flex; flex-direction: column; gap: var(--md-sys-spacing-1); align-items: stretch; }
  .meta-sep { opacity: 0.45; }
  /* The permission mode, sitting with the other facts and reading like one: the
     same outlined pill as the host, filled in only for the two modes that mean
     the session may act on its own. */
  .mode-tag {
    display: inline-flex; align-items: center;
    height: 24px; padding: 0 var(--md-sys-spacing-2);
    border-radius: var(--md-sys-shape-corner-small);
    border: 1px solid currentColor;
  }
  .mode-tag[data-loose="1"] { background: var(--state-on-container); color: var(--state-container); border-color: transparent; }
  /* A caveat that belongs to the fact beside it, so it stays on its line. */
  .fact-note { opacity: 0.75; }
  .host {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 var(--md-sys-spacing-2) 0 6px;
    border-radius: var(--md-sys-shape-corner-small);
    border: 1px solid currentColor;
  }
  .host svg { width: 14px; height: 14px; flex: none; }
  .back-button { display: none; }

  /* ------------------------------- state trace ----------------------------- */
  .trace { margin-top: var(--md-sys-spacing-4); position: relative; }
  .trace__bar {
    display: flex; justify-content: flex-end; gap: 2px; height: 10px;
    border-radius: var(--md-sys-shape-corner-full); overflow: hidden;
    background: var(--md-sys-color-surface);
  }
  .trace__span {
    height: 100%; background: var(--seg); min-width: 1px; cursor: default;
    transition: opacity 120ms ease, filter 120ms ease;
  }
  /* Hovering one span dims the rest, so the piece the tooltip describes is
     unmistakable even when the slices are a pixel wide. */
  .trace__bar:hover .trace__span { opacity: 0.45; }
  /* Must carry :hover too, or the rule above outranks it and dims the hot slice
     along with the rest — the whole bar greys out and nothing stands proud. */
  .trace__bar:hover .trace__span--hot { opacity: 1; filter: brightness(1.15); }
  .trace__tip {
    position: absolute; bottom: calc(100% + var(--md-sys-spacing-2));
    z-index: 5; pointer-events: none; opacity: 0;
    transform: translate(-50%, 4px);
    transition: opacity 120ms ease, transform 120ms ease;
    padding: var(--md-sys-spacing-2) var(--md-sys-spacing-3);
    border-radius: var(--md-sys-shape-corner-small);
    background: var(--md-sys-color-inverse-surface);
    color: var(--md-sys-color-inverse-on-surface);
    box-shadow: 0 2px 6px 2px color-mix(in srgb, var(--md-sys-color-shadow) 15%, transparent),
                0 1px 2px color-mix(in srgb, var(--md-sys-color-shadow) 30%, transparent);
    white-space: nowrap;
  }
  .trace__tip[data-open="1"] { opacity: 1; transform: translate(-50%, 0); }
  .trace__tip-state { display: flex; align-items: center; gap: var(--md-sys-spacing-2); }
  .trace__tip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--seg); flex: none; }
  .trace__tip-times { display: block; margin-top: 2px; opacity: 0.85; }
  .trace__span:first-child { border-radius: var(--md-sys-shape-corner-full) 0 0 var(--md-sys-shape-corner-full); }
  .trace__span:last-child { border-radius: 0 var(--md-sys-shape-corner-full) var(--md-sys-shape-corner-full) 0; }
  .trace__span:only-child { border-radius: var(--md-sys-shape-corner-full); }
  .trace__axis { display: flex; justify-content: space-between; margin-top: var(--md-sys-spacing-1); opacity: 0.75; }

  /* ================================== tabs ================================= */
  /* Four tabs do not fit a phone, so the strip scrolls rather than truncating —
     MD3's scrollable primary tabs. The scrollbar itself is hidden: it would sit
     on the divider and the tabs are reachable by swipe and by keyboard anyway. */
  .tabs {
    flex: none; display: flex; gap: 0;
    background: var(--md-sys-color-surface);
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
    position: sticky; top: 0; z-index: 1;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; flex: 0 0 auto;
    height: 48px; padding: 0 var(--md-sys-spacing-6);
    border: 0; background: transparent; cursor: pointer;
    color: var(--md-sys-color-on-surface-variant);
    display: inline-flex; align-items: center; gap: var(--md-sys-spacing-2);
  }
  .tab svg { width: 18px; height: 18px; }
  .tab[aria-selected="true"] { color: var(--md-sys-color-primary); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 0; width: calc(100% - 32px); height: 3px;
    background: var(--md-sys-color-primary);
    border-radius: var(--md-sys-shape-corner-full) var(--md-sys-shape-corner-full) 0 0;
  }
  /* Holds the scrolling panel and the floating jump button over it. */
  .panel-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .tab-panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: var(--md-sys-spacing-4) var(--md-sys-spacing-6) var(--md-sys-spacing-6); }

  .jump-last {
    position: absolute; right: var(--md-sys-spacing-6); bottom: var(--md-sys-spacing-4);
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 var(--md-sys-spacing-4);
    border: 0; border-radius: var(--md-sys-shape-corner-full); cursor: pointer;
    background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.18);
  }
  .jump-last[hidden] { display: none; }
  .jump-last svg { width: 16px; height: 16px; flex: none; }
  /* One icon, turned over when the message sits below instead of above. */
  .jump-last[data-dir="down"] svg { transform: rotate(180deg); }

  /* =============================== composer ================================ */
  /* Sits outside the scrolling panel so it stays put as the conversation moves. */
  .composer {
    flex: none; display: flex; gap: var(--md-sys-spacing-2); align-items: flex-end;
    padding: var(--md-sys-spacing-3) var(--md-sys-spacing-6) var(--md-sys-spacing-4);
    border-top: 1px solid var(--md-sys-color-outline-variant);
    background: var(--md-sys-color-surface);
    position: relative;
  }
  /* The rule above the box is the handle. It overlays rather than sits in the
     flow, so the grab area is a comfortable 12px without moving anything. */
  .composer-grip {
    position: absolute; top: -6px; left: 0; right: 0; height: 12px;
    border: 0; padding: 0; background: none; cursor: ns-resize; touch-action: none;
  }
  .composer-grip::before {
    content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px;
    border-radius: 1px; background: transparent; transition: background 120ms ease;
  }
  .composer-grip:hover::before,
  .composer-grip:focus-visible::before,
  .composer-grip.is-dragging::before { background: var(--md-sys-color-primary); }
  .composer-grip:focus-visible { outline: none; }
  .composer__field {
    flex: 1 1 auto; min-width: 0; resize: none; max-height: 40vh;
    padding: var(--md-sys-spacing-3) var(--md-sys-spacing-4);
    border-radius: var(--md-sys-shape-corner-large);
    border: 1px solid var(--md-sys-color-outline);
    background: var(--md-sys-color-surface-container-lowest);
    color: var(--md-sys-color-on-surface);
    font: inherit; font-family: var(--md-sys-typescale-body-large-font, inherit);
  }
  .composer__field:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px; border-color: transparent; }
  .composer__field:disabled { background: color-mix(in srgb, var(--md-sys-color-on-surface) 4%, transparent);
    border-color: var(--md-sys-color-outline-variant); color: var(--md-sys-color-on-surface-variant); }
  .composer__send { flex: none; min-height: 48px; }
  /* Why it is off, in the place the reader is already looking. */
  .composer__why { flex: 1 1 auto; margin: 0; color: var(--md-sys-color-on-surface-variant); }

  /* ================================== chat ================================= */
  .chat { display: flex; flex-direction: column; gap: var(--md-sys-spacing-3); }
  .chat__note { align-self: center; color: var(--md-sys-color-on-surface-variant); padding: var(--md-sys-spacing-2) 0; }
  .msg { max-width: min(76%, 720px); padding: var(--md-sys-spacing-3) var(--md-sys-spacing-4); border-radius: var(--md-sys-shape-corner-large); }
  .msg--user {
    align-self: flex-end;
    background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
    border-end-end-radius: var(--md-sys-shape-corner-extra-small);
  }
  .msg--assistant {
    align-self: flex-start;
    background: var(--md-sys-color-surface-container-low); color: var(--md-sys-color-on-surface);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-end-start-radius: var(--md-sys-shape-corner-extra-small);
  }
  /* A turn that only ran tools is activity, not conversation — it gets a quiet
     full-width row instead of a speech bubble. */
  .activity-row {
    display: flex; align-items: baseline; gap: var(--md-sys-spacing-2);
    padding: var(--md-sys-spacing-1) var(--md-sys-spacing-2);
    color: var(--md-sys-color-on-surface-variant);
  }
  .activity-row__time { flex: none; opacity: 0.7; }
  .activity-row__tools { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
  .msg__who { display: flex; align-items: baseline; gap: var(--md-sys-spacing-2); margin-bottom: var(--md-sys-spacing-1); opacity: 0.8; }
  /* Rendered Markdown. The bubble sets the rhythm: first and last child sit
     flush with the padding, everything between gets one gap of air. */
  .msg__text { overflow-wrap: anywhere; }
  .msg__text > * { margin: var(--md-sys-spacing-2) 0; }
  .msg__text > :first-child { margin-top: 0; }
  .msg__text > :last-child { margin-bottom: 0; }
  .msg__text .md-head { margin: var(--md-sys-spacing-3) 0 var(--md-sys-spacing-1); font-weight: 700; }
  .msg__text ul, .msg__text ol { padding-inline-start: 1.4em; }
  .msg__text li { margin: 2px 0; }
  .msg__text li > ul, .msg__text li > ol { margin: 2px 0; }
  .msg__text a { color: inherit; text-underline-offset: 2px; }
  .msg__text code {
    padding: 1px 5px; border-radius: var(--md-sys-shape-corner-extra-small);
    background: color-mix(in srgb, currentColor 12%, transparent); font-size: 0.92em;
  }
  .md-code {
    margin: var(--md-sys-spacing-2) 0; padding: var(--md-sys-spacing-3);
    border-radius: var(--md-sys-shape-corner-medium);
    background: color-mix(in srgb, currentColor 8%, transparent);
    border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
    overflow-x: auto; white-space: pre; -webkit-overflow-scrolling: touch;
  }
  .md-code code { padding: 0; background: none; font-size: 0.88em; line-height: 1.5; }
  .msg__text blockquote {
    margin-inline: 0; padding-inline-start: var(--md-sys-spacing-3);
    border-inline-start: 3px solid color-mix(in srgb, currentColor 30%, transparent);
    opacity: 0.9;
  }
  .msg__text hr { border: 0; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  /* Tables can be wider than the bubble, so they scroll on their own. */
  .md-table { display: block; overflow-x: auto; border-collapse: collapse; max-width: 100%; }
  .md-table th, .md-table td {
    padding: 4px var(--md-sys-spacing-2); text-align: left;
    border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
  }
  .md-table th { font-weight: 700; background: color-mix(in srgb, currentColor 7%, transparent); }
  .msg__tools { display: flex; flex-direction: column; gap: var(--md-sys-spacing-1); margin-top: var(--md-sys-spacing-2); }
  .tool-line {
    display: flex; align-items: baseline; gap: var(--md-sys-spacing-2);
    padding: 5px var(--md-sys-spacing-2);
    border-radius: var(--md-sys-shape-corner-extra-small);
    background: color-mix(in srgb, currentColor 8%, transparent);
  }
  .tool-line__name { flex: none; font-weight: 700; }
  .tool-line__detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; opacity: 0.85; }

  /* ============================== detail: facts ============================ */
  .section { margin-bottom: var(--md-sys-spacing-6); }
  .section__title { color: var(--md-sys-color-on-surface-variant); margin-bottom: var(--md-sys-spacing-3); }
  .facts { display: grid; grid-template-columns: minmax(120px, 180px) 1fr; gap: 0; margin: 0; }
  .facts dt { padding: var(--md-sys-spacing-2) 0; color: var(--md-sys-color-on-surface-variant); border-top: 1px solid var(--md-sys-color-outline-variant); }
  .facts dd { padding: var(--md-sys-spacing-2) 0; margin: 0; border-top: 1px solid var(--md-sys-color-outline-variant); overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; gap: var(--md-sys-spacing-4); flex-wrap: wrap; }
  /* Identify and pair sit side by side when a window cannot be told apart. */
  .detail-window-actions { display: flex; gap: var(--md-sys-spacing-2); flex-wrap: wrap; }
  .row__grow { flex: 1 1 auto; min-width: 0; }

  /* =============================== detail: git ============================= */
  /* The branch line: where HEAD is, and how far it has drifted from upstream. */
  .git-head { display: flex; align-items: center; gap: var(--md-sys-spacing-3); flex-wrap: wrap;
    margin-bottom: var(--md-sys-spacing-4); }
  .git-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px var(--md-sys-spacing-3);
    border-radius: var(--md-sys-shape-corner-small);
    background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
  }
  .git-badge svg { width: 15px; height: 15px; }
  .git-badge--quiet { background: transparent; color: var(--md-sys-color-on-surface-variant);
    padding-inline: 0; }

  /* One row per changed file. The status letters keep a fixed column so the
     paths line up down the list and a glance reads the shape of the change. */
  .git-files { display: flex; flex-direction: column; }
  .git-file {
    display: flex; align-items: center; gap: var(--md-sys-spacing-3);
    padding: var(--md-sys-spacing-2) 0;
    border-top: 1px solid var(--md-sys-color-outline-variant);
  }
  .git-file__xy { flex: none; width: 2ch; letter-spacing: 1px; text-align: center;
    color: var(--md-sys-color-on-surface-variant); }
  .git-file__path { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; direction: rtl; text-align: left; }
  .git-file__dir { color: var(--md-sys-color-on-surface-variant); }
  .git-file__from { flex: none; color: var(--md-sys-color-on-surface-variant); }
  /* Added, modified, removed and conflicted each get a colour that is already in
     the scheme, so they follow the base colour like everything else. */
  .git-file[data-mark="A"] .git-file__xy { color: var(--md-extended-color-idle-color, var(--md-sys-color-primary)); }
  .git-file[data-mark="D"] .git-file__xy { color: var(--md-sys-color-error); }
  .git-file[data-mark="U"] .git-file__xy { color: var(--md-sys-color-error); font-weight: 700; }

  /* The graph: one lane per concurrent line of history, drawn beside the log. */
  .git-graph { display: grid; grid-template-columns: auto 1fr; }
  .git-graph__lanes { grid-column: 1; }
  /* A fixed height, because the rail beside each row is an SVG of exactly this
     many pixels: let the rows grow with their text and the lanes stop meeting
     across the join. The subject is ellipsised rather than wrapped for the same
     reason. */
  .git-commit {
    display: grid; grid-template-columns: subgrid; grid-column: 1 / -1;
    align-items: center; gap: var(--md-sys-spacing-3);
    height: 52px;
  }
  .git-commit__rail { grid-column: 1; align-self: stretch; display: block; }
  /* The separator runs under the text only. Carrying it across the rail column
     would put a 1px break through every lane, at every row. */
  .git-commit__body { grid-column: 2; min-width: 0; align-self: stretch;
    display: flex; flex-direction: column; justify-content: center;
    border-top: 1px solid var(--md-sys-color-outline-variant); }
  .git-commit__subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .git-commit__meta { color: var(--md-sys-color-on-surface-variant); display: flex; gap: 6px;
    align-items: center; flex-wrap: wrap; }
  .git-ref {
    padding: 1px 6px; border-radius: var(--md-sys-shape-corner-extra-small);
    background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
  }
  .git-ref--head { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
  .git-empty { color: var(--md-sys-color-on-surface-variant); padding: var(--md-sys-spacing-3) 0; }

  /* ================================= buttons =============================== */
  .button {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--md-sys-spacing-2);
    height: 40px; padding: 0 var(--md-sys-spacing-6);
    border: 0; border-radius: var(--md-sys-shape-corner-full);
    cursor: pointer; white-space: nowrap;
    font: var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/var(--md-sys-typescale-label-large-line-height) var(--md-sys-typescale-label-large-font);
    letter-spacing: var(--md-sys-typescale-label-large-tracking);
  }
  .button::after { content: ""; position: absolute; inset: -4px; }
  .button svg { width: 18px; height: 18px; flex: none; }
  .button--filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
  .button--tonal { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .button--text { background: transparent; color: var(--md-sys-color-primary); padding: 0 var(--md-sys-spacing-3); }
  .button--outlined { background: transparent; color: currentColor; border: 1px solid currentColor; }
  /* On the tinted detail header, the card's own pair is the only safe fill. */
  .detail-header .button--filled,
  .detail-header .button--tonal { background: var(--state-on-container); color: var(--state-container); }
  .button--danger { background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); }
  .button--danger-outlined { background: transparent; color: var(--md-sys-color-error); border: 1px solid var(--md-sys-color-error); }
  .button:disabled { opacity: 0.38; cursor: not-allowed; }
  .hint { display: flex; gap: 5px; justify-content: center; align-items: baseline; opacity: 0.85; }
  .link-button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 2px; }

  /* ================================= switch ================================ */
  .switch { display: inline-flex; align-items: center; gap: var(--md-sys-spacing-3); cursor: pointer; user-select: none; }
  .switch__label { color: var(--md-sys-color-on-surface-variant); }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch__track {
    position: relative; width: 52px; height: 32px; flex: none;
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-surface-container-highest);
    border: 2px solid var(--md-sys-color-outline);
    transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),
                border-color var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .switch__thumb {
    position: absolute; top: 50%; left: 6px; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-outline);
    display: grid; place-items: center;
    transition: left var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized),
                width var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized),
                height var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized),
                background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard);
  }
  .switch__thumb svg { width: 16px; height: 16px; opacity: 0; }
  .switch input:checked + .switch__track { background: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); }
  .switch input:checked + .switch__track .switch__thumb { left: 22px; width: 24px; height: 24px; background: var(--md-sys-color-on-primary); }
  .switch input:checked + .switch__track .switch__thumb svg { opacity: 1; stroke: var(--md-sys-color-primary); }
  .switch input:focus-visible + .switch__track { outline: 3px solid var(--md-sys-color-primary); outline-offset: 3px; }

  /* ============================== segmented button ========================= */
  .segmented { display: inline-flex; }
  .segmented__item {
    height: 40px; padding: 0 var(--md-sys-spacing-4);
    border: 1px solid var(--md-sys-color-outline);
    background: transparent; color: var(--md-sys-color-on-surface);
    cursor: pointer; position: relative;
    display: inline-flex; align-items: center; gap: 6px;
    font: var(--md-sys-typescale-label-large-weight) var(--md-sys-typescale-label-large-size)/var(--md-sys-typescale-label-large-line-height) var(--md-sys-typescale-label-large-font);
  }
  .segmented__item:first-child { border-radius: var(--md-sys-shape-corner-full) 0 0 var(--md-sys-shape-corner-full); }
  .segmented__item:last-child { border-radius: 0 var(--md-sys-shape-corner-full) var(--md-sys-shape-corner-full) 0; border-left-width: 0; }
  .segmented__item:not(:first-child):not(:last-child) { border-left-width: 0; }
  .segmented__item[aria-pressed="true"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
  .segmented__item svg { width: 18px; height: 18px; display: none; }
  .segmented__item[aria-pressed="true"] svg { display: block; }

  /* ============================== context menu ============================= */
  /* Right-clicking a session opens this over everything, positioned at the
     pointer. Fixed, and a child of body, so a list repaint cannot tear it out. */
  .menu {
    position: fixed; z-index: 20; min-width: 232px; max-width: min(320px, 92vw);
    padding: var(--md-sys-spacing-2) 0;
    /* A short window must not put the last items out of reach — scroll instead
       of overflowing. The cap is set from innerHeight when it opens. */
    max-height: calc(100vh - 16px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--md-sys-color-surface-container);
    color: var(--md-sys-color-on-surface);
    border-radius: var(--md-sys-shape-corner-small);
    box-shadow: 0 2px 6px 2px color-mix(in srgb, var(--md-sys-color-shadow) 15%, transparent),
                0 1px 2px 0 color-mix(in srgb, var(--md-sys-color-shadow) 30%, transparent);
    opacity: 0; transform: scale(0.96); transform-origin: top left;
    transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard),

  }
  .menu[data-open="true"] { opacity: 1; transform: scale(1); }
  /* Which session this menu belongs to — the list keeps its own selection. */
  .menu__title {
    padding: var(--md-sys-spacing-2) var(--md-sys-spacing-4) var(--md-sys-spacing-3);
    color: var(--md-sys-color-on-surface-variant);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .menu__item {
    display: flex; align-items: center; gap: var(--md-sys-spacing-3);
    width: 100%; min-height: 48px; padding: var(--md-sys-spacing-2) var(--md-sys-spacing-4);
    border: 0; background: none; color: inherit; text-align: left; cursor: pointer;
    font: inherit;
  }
  .menu__item:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px; }
  .menu__item[disabled] { color: var(--md-sys-color-on-surface-variant); opacity: 0.38; cursor: default; }
  .menu__item--danger { color: var(--md-sys-color-error); }
  .menu__icon { flex: none; display: grid; place-items: center; width: 20px; height: 20px; }
  .menu__icon svg { width: 20px; height: 20px; }
  .menu__label { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The state the label cannot carry: which window matched, where the folder is. */
  .menu__hint { flex: none; color: var(--md-sys-color-on-surface-variant); opacity: 0.9; max-width: 42%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu__item--danger .menu__hint { color: inherit; }
  .menu__divider { height: 1px; margin: var(--md-sys-spacing-2) 0; border: 0;
    background: var(--md-sys-color-outline-variant); }
  /* The row — or group header — the open menu acts on, so the target is never
     in doubt. */
  .session-list li[data-menu="open"] > .session-item,
  .session-list li[data-menu="open"] > .group__header {
    outline: 2px solid var(--md-sys-color-primary); outline-offset: -2px;
  }

  /* ================================= dialog ================================ */
  .scrim {
    position: fixed; inset: 0; z-index: 10;
    background: color-mix(in srgb, var(--md-sys-color-scrim) 32%, transparent);
    display: grid; place-items: center; padding: var(--md-sys-spacing-4);
    opacity: 0; pointer-events: none;

  }

  .dialog {
    width: min(560px, 100%); max-height: 90vh; overflow: auto;
    background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface);
    border-radius: var(--md-sys-shape-corner-extra-large);
    padding: var(--md-sys-spacing-6);
    transform: scale(0.9); opacity: 0;
    transition: transform var(--md-sys-motion-duration-medium4) var(--md-sys-motion-easing-emphasized-decelerate),

  .dialog__headline { margin-bottom: var(--md-sys-spacing-2); }
  .dialog__supporting { color: var(--md-sys-color-on-surface-variant); margin-bottom: var(--md-sys-spacing-6); }
  .dialog__actions { display: flex; justify-content: flex-end; gap: var(--md-sys-spacing-2); }
  /* Keeps the last-resort action away from the one people mean to press. */
  .dialog__actions-start { margin-right: auto; color: var(--md-sys-color-on-surface-variant); }
  .divider { height: 1px; background: var(--md-sys-color-outline-variant); border: 0; margin: 0 0 var(--md-sys-spacing-6); }

  .swatches { display: flex; flex-wrap: wrap; gap: var(--md-sys-spacing-3); align-items: center; }
  .swatch {
    width: 48px; height: 48px; flex: none; position: relative;
    border-radius: var(--md-sys-shape-corner-full);
    border: 2px solid transparent; background: var(--swatch);
    cursor: pointer; display: grid; place-items: center;
    transition: transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized);
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-pressed="true"] { border-color: var(--md-sys-color-on-surface); }
  .swatch svg { width: 22px; height: 22px; opacity: 0; stroke: var(--swatch-on); }
  .swatch[aria-pressed="true"] svg { opacity: 1; }
  .swatch--custom { background: var(--md-sys-color-surface-container-highest); overflow: hidden; }
  .swatch--custom input { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; cursor: pointer; opacity: 0; }
  .swatch--custom svg { opacity: 1; stroke: var(--md-sys-color-on-surface-variant); }
  .seed-readout { color: var(--md-sys-color-on-surface-variant); margin-top: var(--md-sys-spacing-3); }
  .code { font-family: var(--md-ref-typeface-mono); background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface); padding: 1px 6px; border-radius: var(--md-sys-shape-corner-extra-small); }

  /* ================================ snackbar =============================== */
  .snackbar {
    position: fixed; left: 50%; bottom: var(--md-sys-spacing-6); z-index: 12;
    transform: translate(-50%, calc(100% + 48px));
    display: flex; align-items: center; gap: var(--md-sys-spacing-2);
    min-height: 48px; padding: var(--md-sys-spacing-3) var(--md-sys-spacing-4);
    background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface);
    border-radius: var(--md-sys-shape-corner-extra-small);
    box-shadow: 0 4px 8px 3px color-mix(in srgb, var(--md-sys-color-shadow) 15%, transparent),
                0 1px 3px color-mix(in srgb, var(--md-sys-color-shadow) 30%, transparent);
    max-width: min(560px, calc(100vw - 32px));
    transition: transform var(--md-sys-motion-duration-long2) var(--md-sys-motion-easing-emphasized);
  }
  .snackbar[data-open="true"] { transform: translate(-50%, 0); }

  /* =============================== responsive ============================== */
  /* Compact: one pane at a time, with a back affordance — the canonical
     list-detail behaviour below 600dp. */
  @media (max-width: 899px) {
    .panes { grid-template-columns: 1fr; }
    .panes[data-view="list"] .detail-pane { display: none; }
    .panes[data-view="detail"] .list-pane { display: none; }
    .panes[data-view="detail"] .back-button { display: grid; }
    .app-bar__supporting { display: none; }
    .detail-header, .tab-panel { padding-inline: var(--md-sys-spacing-4); }
    /* Tighter tabs so four of them mostly fit before the strip has to scroll,
       while keeping the 48dp target height. */
    .tab { padding-inline: var(--md-sys-spacing-4); }
    .msg { max-width: 92%; }

<body>
<div class="app">
  <header class="app-bar">
    <button class="icon-button md-state back-button" id="backButton" aria-label="Back to the session list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="app-bar__headline">
      <h1 class="app-bar__title md-title-large">Claude sessions</h1>
      <span class="app-bar__supporting md-label-medium" id="barSupporting"></span>
    </div>
    <div class="app-bar__actions">
      <label class="switch">
        <input type="checkbox" id="themeToggle" aria-label="Dark theme">
        <span class="switch__track"><span class="switch__thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span></span>
        <span class="switch__label md-label-large" id="themeLabel">Light</span>
      </label>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09A1.7 1.7 0 0 0 21 10.1a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="panes" id="panes" data-view="list">

</div>

<div class="scrim" id="settingsScrim" data-open="false">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settingsHeadline">
    <h2 class="dialog__headline md-headline-small" id="settingsHeadline">Appearance</h2>
    <p class="dialog__supporting md-body-medium">
      The whole palette is generated from one base colour, the way Material 3 dynamic
      colour works. Pick a base and every surface, container, and state colour is
      derived from it.
    </p>
    <section class="section">
      <h3 class="section__title md-title-small">Base colour</h3>
      <div class="swatches" id="swatches"></div>
      <p class="seed-readout md-body-small" id="seedReadout"></p>
    </section>
    <hr class="divider">
    <section class="section">
      <h3 class="section__title md-title-small">Contrast</h3>
      <div class="segmented" id="contrastGroup" role="group" aria-label="Contrast level"></div>
    </section>

<div class="scrim" id="endScrim" data-open="false">

<div class="menu" id="sessionMenu" role="menu" data-open="false" hidden></div>

<div class="snackbar md-body-medium" id="snackbar" role="status" aria-live="polite" data-open="false"></div>

<script type="module">
import {
  argbFromHex, hexFromArgb, Hct, SchemeVibrant, TonalPalette,
} from "/vendor/material-color-utilities.js";

/* ==========================================================================
   Dynamic colour — one seed generates the entire scheme.
   ========================================================================== */
const DEFAULT_SEED = "#E8288F";
const SEED_PRESETS = [
  { hex: "#E8288F", name: "Pink" }, { hex: "#7C4DFF", name: "Violet" },
  { hex: "#00A18F", name: "Teal" }, { hex: "#F4511E", name: "Coral" },
  { hex: "#3D5AFE", name: "Blue" }, { hex: "#7CB342", name: "Green" },
];
const CONTRAST_LEVELS = [
  { key: "standard", label: "Standard", value: 0 },
  { key: "medium", label: "Medium", value: 0.5 },
  { key: "high", label: "High", value: 1 },
];
const STATE_BASE_HUES = { waiting: "#FF8A00", idle: "#5B6BC0" };
const MIN_HUE_GAP = 35;
const MAX_CUSTOM_CHROMA = 48;

const SYS_ROLES = [
  "primary", "onPrimary", "primaryContainer", "onPrimaryContainer",
  "secondary", "onSecondary", "secondaryContainer", "onSecondaryContainer",
  "tertiary", "onTertiary", "tertiaryContainer", "onTertiaryContainer",
  "error", "onError", "errorContainer", "onErrorContainer",
  "surface", "onSurface", "onSurfaceVariant", "surfaceDim", "surfaceBright",
  "surfaceContainerLowest", "surfaceContainerLow", "surfaceContainer",
  "surfaceContainerHigh", "surfaceContainerHighest",
  "outline", "outlineVariant", "inverseSurface", "inverseOnSurface", "inversePrimary",
  "shadow", "scrim",
];
const kebab = (name) => name.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase());
const hueDistance = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

function firstFreeHue(baseHue, occupied) {
  for (let delta = 0; delta <= 180; delta += 5) {
    for (const sign of delta === 0 ? [1] : [1, -1]) {
      const candidate = (baseHue + sign * delta + 360) % 360;
      if (occupied.every((hue) => hueDistance(candidate, hue) >= MIN_HUE_GAP)) return candidate;
    }
  }
  return baseHue;
}
function customRoles(palette, dark) {
  return dark
    ? { color: palette.tone(80), onColor: palette.tone(20), container: palette.tone(30), onContainer: palette.tone(90) }
    : { color: palette.tone(40), onColor: palette.tone(100), container: palette.tone(90), onContainer: palette.tone(10) };
}

let settings = { seed: DEFAULT_SEED, dark: matchMedia("(prefers-color-scheme: dark)").matches, contrast: "standard" };

function loadSettings() {
  const params = new URLSearchParams(location.search);
  const seed = params.get("seed") || localStorage.getItem("cbu-seed");
  if (seed && /^#[0-9a-f]{6}$/i.test(seed)) settings.seed = seed;
  const theme = params.get("theme") || localStorage.getItem("cbu-theme");
  if (theme === "dark" || theme === "light") settings.dark = theme === "dark";
  const contrast = params.get("contrast") || localStorage.getItem("cbu-contrast");
  if (CONTRAST_LEVELS.some((l) => l.key === contrast)) settings.contrast = contrast;
}
function persist() {
  localStorage.setItem("cbu-seed", settings.seed);
  localStorage.setItem("cbu-theme", settings.dark ? "dark" : "light");
  localStorage.setItem("cbu-contrast", settings.contrast);
}

function applyScheme() {
  const root = document.documentElement;
  const seedArgb = argbFromHex(settings.seed);
  const level = CONTRAST_LEVELS.find((l) => l.key === settings.contrast) || CONTRAST_LEVELS[0];
  const scheme = new SchemeVibrant(Hct.fromInt(seedArgb), settings.dark, level.value);
  for (const role of SYS_ROLES) {
    if (scheme[role] === undefined) continue;
    root.style.setProperty(`--md-sys-color-${kebab(role)}`, hexFromArgb(scheme[role]));
  }
  const occupied = [Hct.fromInt(scheme.primary).hue];
  for (const [name, baseHex] of Object.entries(STATE_BASE_HUES)) {
    const base = Hct.fromInt(argbFromHex(baseHex));
    const hue = firstFreeHue(base.hue, occupied);
    occupied.push(hue);
    const palette = TonalPalette.fromHueAndChroma(hue, Math.min(base.chroma, MAX_CUSTOM_CHROMA));
    for (const [role, argb] of Object.entries(customRoles(palette, settings.dark))) {
      root.style.setProperty(`--md-extended-color-${name}-${kebab(role)}`, hexFromArgb(argb));
    }
  }
  root.style.colorScheme = settings.dark ? "dark" : "light";
  root.dataset.schemeReady = "true";
  themeToggle.checked = settings.dark;
  themeLabel.textContent = settings.dark ? "Dark" : "Light";
  paintFavicon();
}

/* ------------------------------------------------------------- state map */
const STATE = {
  waiting: { label: "Needs an answer", short: "answer", prefix: "--md-extended-color-waiting" },
  busy: { label: "Working", short: "working", prefix: "--md-sys-color-primary", sys: true },
  idle: { label: "Waiting", short: "waiting", prefix: "--md-extended-color-idle" },
  offline: { label: "Closed", short: "closed", prefix: null },
  // A kept session whose process has gone. Not lost, just not running.
  stopped: { label: "Stopped", short: "stopped", prefix: null },
};
/* `shell` is not shown as a state of its own. It is what Claude Code writes on
   the way into a foreground command *and* what it leaves behind when a turn
   ends, so on screen it was a second colour for the same thing: waiting. The raw
   status still drives behaviour (a message can be queued for a shell session);
   only the display folds it in. */
const STATE_ALIAS = { shell: "idle" };
const stateKeyOf = (status) => STATE_ALIAS[status] || status;
const stateOf = (status) => STATE[stateKeyOf(status)] || STATE.idle;

/* When the state you can see began. The server times the raw status, which
   restarts every time a waiting session dips through `shell`; on screen nothing
   happened, so the clock should not jump back to zero. */
function displaySince(session) {
  const spans = session.trace || [];
  const key = stateKeyOf(session.status);
  let since = session.statusSince;
  for (let i = spans.length - 1; i >= 0; i--) {
    if (stateKeyOf(spans[i].status) !== key) break;
    since = spans[i].from;
  }
  return since;
}
for (const entry of Object.values(STATE)) {
  if (entry.sys) {
    entry.colour = "var(--md-sys-color-primary)";
    entry.container = "var(--md-sys-color-primary-container)";
    entry.onContainer = "var(--md-sys-color-on-primary-container)";
  } else if (entry.prefix) {
    entry.colour = `var(${entry.prefix}-color)`;
    entry.container = `var(${entry.prefix}-container)`;
    entry.onContainer = `var(${entry.prefix}-on-container)`;
  } else {
    entry.colour = "var(--md-sys-color-outline)";
    entry.container = "var(--md-sys-color-surface-container-high)";
    entry.onContainer = "var(--md-sys-color-on-surface-variant)";
  }
}
const STATE_ORDER = ["waiting", "busy", "idle", "offline", "stopped"];

/* ---------------------------------------------------------------- icons */
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  focus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M21 3l-9 9M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>',
  pair: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7 16 2-6 6-2z"/></svg>',
  power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.5-5A8 8 0 1 1 21 12z"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  // The branch, for the Git tab and the header badge on both git tabs.
  branch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="18" r="2.5"/><circle cx="6.5" cy="6" r="2.5"/><circle cx="17.5" cy="10" r="2.5"/><path d="M6.5 8.5v7M17.5 12.5c0 3-2.5 3.5-5.5 3.5"/></svg>',

/* ==========================================================================
   Grouping the index.

   Two kinds of group, and they mean different things. A *folder* group is not
   stored at all: it is what the list looks like when two or more sessions share
   a working folder, which is the shape most people's sessions already have —
   several Claudes in one repository. A group you make yourself, by picking rows
   and pressing Group, is stored, wins over the folder grouping for the rows in
   it, and keeps its own name.

   All of it is a view of the list, so it lives in this browser rather than on
   the server, the same way muting does.
   ========================================================================== */
function loadGroups() {
  try {
    const raw = JSON.parse(localStorage.getItem("cbu-groups") || "[]");
    if (!Array.isArray(raw)) return [];
    return raw
      .filter((g) => g && typeof g.id === "string" && Array.isArray(g.members))
      .map((g) => ({
        id: g.id,
        name: typeof g.name === "string" && g.name.trim() ? g.name : "Group",
        members: g.members.filter((id) => typeof id === "string"),
        collapsed: !!g.collapsed,
      }))
      .filter((g) => g.members.length);
  } catch (error) {
    return [];
  }
}
let customGroups = loadGroups();
const saveGroups = () => localStorage.setItem("cbu-groups", JSON.stringify(customGroups));

/* Folders you told the panel not to group, and groups you folded away. Both are
   keyed by the folder path, which outlives the sessions in it. */
const loadKeySet = (key) => {
  try {
    const raw = JSON.parse(localStorage.getItem(key) || "[]");
    return new Set(Array.isArray(raw) ? raw.filter((k) => typeof k === "string") : []);
  } catch (error) {
    return new Set();
  }
};
let looseFolders = loadKeySet("cbu-loose-folders");
let collapsedFolders = loadKeySet("cbu-collapsed-folders");
const saveKeySet = (key, set) => localStorage.setItem(key, JSON.stringify([...set]));

/* The rows ticked for a group action, the row a shift-click measures from, and
   the ids the list is showing in the order it draws them — which is what makes a
   shift-click select the run you can actually see. */
let picked = new Set();
let pickAnchor = null;
let visibleOrder = [];
/* The blocks the list is showing, so a menu opened from the keyboard can find
   the group its header belongs to. */
let lastBlocks = [];
/* The group whose name is being typed, so a poll cannot rebuild the list out
   from under the field. */
let renamingGroup = null;

const groupOf = (id) => customGroups.find((g) => g.members.includes(id)) || null;
const folderKeyOf = (session) => session.cwd || session.folder || "";

/* What the index draws, top to bottom: bare rows and groups, each group where
   its first member would have been. */
function listBlocks(visible) {
  const perFolder = new Map();
  for (const session of visible) {
    if (groupOf(session.sessionId)) continue;
    const key = folderKeyOf(session);
    perFolder.set(key, (perFolder.get(key) || 0) + 1);
  }
  const blocks = [];
  const open = new Map();
  for (const session of visible) {
    const custom = groupOf(session.sessionId);
    const folder = folderKeyOf(session);
    let key = null;
    if (custom) key = `custom:${custom.id}`;
    // One session in a folder is a row, not a group of one.
    else if (folder && perFolder.get(folder) > 1 && !looseFolders.has(folder)) key = `folder:${folder}`;
    if (!key) {
      blocks.push({ kind: "session", session });
      continue;
    }
    let block = open.get(key);
    if (!block) {
      block = {
        kind: "group", key, custom,
        folder: custom ? null : folder,
        name: custom ? custom.name : (session.folder || folder),
        collapsed: custom ? custom.collapsed : collapsedFolders.has(folder),
        sessions: [],
      };
      open.set(key, block);
      blocks.push(block);
    }
    block.sessions.push(session);
  }
  return blocks;
}

function toggleGroup(block) {
  if (block.custom) {
    block.custom.collapsed = !block.custom.collapsed;
    saveGroups();
  } else {
    if (collapsedFolders.has(block.folder)) collapsedFolders.delete(block.folder);
    else collapsedFolders.add(block.folder);
    saveKeySet("cbu-collapsed-folders", collapsedFolders);
  }
  render();
}

/* Picking rows. Ctrl-click ticks one, shift-click ticks the run between it and
   the last row you touched; a plain click goes back to selecting one session. */
function togglePick(id) {
  if (picked.has(id)) picked.delete(id);
  else picked.add(id);
  render();
}

function pickRange(from, to) {
  const a = visibleOrder.indexOf(from);
  const b = visibleOrder.indexOf(to);
  if (a === -1 || b === -1) return togglePick(to);
  for (const id of visibleOrder.slice(Math.min(a, b), Math.max(a, b) + 1)) picked.add(id);
  render();
}

function clearPicked(repaint = true) {
  if (!picked.size) return;
  picked.clear();
  if (repaint) render();
}

function onRowClick(id, event) {
  if (event.ctrlKey || event.metaKey) {
    togglePick(id);
    pickAnchor = id;
    return;
  }
  if (event.shiftKey) {
    pickRange(pickAnchor ?? id, id);
    pickAnchor = id;
    return;
  }
  picked.clear();
  pickAnchor = id;
  selectSession(id);
}

/* Group the picked rows. They leave whatever group they were in — a session
   belongs to one — and the new group takes the folder's name when they share
   one, because that is what you would have called it. */
function groupPicked() {
  const ids = visibleOrder.filter((id) => picked.has(id));
  if (ids.length < 2) return;
  const sessions = ids.map(sessionById).filter(Boolean);
  const folders = new Set(sessions.map((s) => s.folder).filter(Boolean));
  const name = folders.size === 1 ? [...folders][0] : `${ids.length} sessions`;
  for (const group of customGroups) group.members = group.members.filter((id) => !picked.has(id));
  customGroups = customGroups.filter((g) => g.members.length);
  customGroups.unshift({ id: `g${Date.now().toString(36)}`, name, members: ids, collapsed: false });
  saveGroups();
  picked.clear();
  showSnackbar(`Grouped ${ids.length} sessions as “${name}”`);
  render();
}

function ungroup(block) {
  if (block.custom) {
    customGroups = customGroups.filter((g) => g.id !== block.custom.id);
    saveGroups();
    showSnackbar(`“${block.name}” ungrouped`);
  } else {
    // A folder group is not stored, so leaving it apart is what gets stored.
    looseFolders.add(block.folder);
    saveKeySet("cbu-loose-folders", looseFolders);
    showSnackbar(`${block.name} is no longer grouped by folder`);
  }
  render();
}

function leaveGroup(id) {
  const group = groupOf(id);
  if (!group) return;
  group.members = group.members.filter((member) => member !== id);
  customGroups = customGroups.filter((g) => g.members.length);
  saveGroups();
  showSnackbar("Taken out of the group");
  render();
}

function regroupFolders() {
  looseFolders.clear();
  saveKeySet("cbu-loose-folders", looseFolders);
  render();
}

function syncPickBar() {
  const count = picked.size;
  pickBar.hidden = count === 0;
  pickCount.textContent = count
    ? `${count} picked${count < 2 ? " — ctrl-click another" : ""}`
    : "";
  pickGroup.disabled = count < 2;
}

/* -------------------------------------------------------------------- format */
function duration(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  if (h) return `${h}h${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}
function shorten(path, keep = 2) {
  const home = path.replace(/^\/home\/[^/]+/, "~");
  const parts = home.split("/");
  return parts.length > keep + 2 ? `${parts[0]}/…/${parts.slice(-keep).join("/")}` : home;
}
function clockOf(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  return Number.isNaN(date.valueOf()) ? "" : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const selected = () => feed.sessions.find((s) => s.sessionId === selectedId) || null;

/* ------------------------------------------------------------------ markdown */
/* A transcript is Markdown, and reading it raw — literal ###, **, and fences —
   is hard work, so the bubbles render it. This is a small line-based renderer:
   headings, lists, fenced and inline code, quotes, tables, rules, emphasis and
   links, which is what a Claude answer actually uses.

   Safety: nothing from a message ever reaches the page as markup. Code is held
   aside before anything else runs, every other scrap is escaped before a tag is
   added, and a link is only made when its target is http, https or mailto. */
const MD_HOLD = "\u0000";

function safeUrl(url) {
  const value = String(url).trim();
  return /^(https?:\/\/|mailto:)[^\s"'<>]+$/i.test(value) ? value : null;
}

function renderMarkdown(text) {
  const held = [];
  const keep = (html) => `${MD_HOLD}${held.push(html) - 1}${MD_HOLD}`;
  const source = String(text ?? "").replace(/\r\n?/g, "\n");

  // Fenced code first: nothing inside a fence is Markdown. A fence inside a list
  // is indented, so the indent comes off the code and stays on the line — that is
  // what keeps the block inside its list item.
  const body = source.replace(/^([ \t]*)```[^\n]*\n?([\s\S]*?)(?:^[ \t]*```[ \t]*$|$(?![\s\S]))/gm, (all, pad, code) => {
    const flat = pad ? code.replace(new RegExp(`^${pad}`, "gm"), "") : code;
    return pad + keep(`<pre class="md-code"><code class="md-mono">${escapeHtml(flat.replace(/\n$/, ""))}</code></pre>`);
  });

  const inline = (raw) => {
    // Inline code goes the same way, so emphasis cannot reach inside it.
    let s = String(raw).replace(/`([^`\n]+)`/g, (all, code) => keep(`<code class="md-mono">${escapeHtml(code)}</code>`));
    s = escapeHtml(s);
    // An image becomes a link to it: the panel never loads a remote file.
    s = s.replace(/!\[([^\]\n]*)\]\(([^)\s]+)\)/g, (all, alt, url) => `[${alt || "image"}](${url})`);
    s = s.replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, (all, label, url) => {
      const href = safeUrl(url.replace(/&amp;/g, "&"));
      return href ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${label || escapeHtml(href)}</a>` : all;
    });
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (all, before, url) => {
      // A sentence's full stop is not part of its link.
      const trail = url.match(/[.,;:!?]+$/)?.[0] || "";
      const bare = url.slice(0, url.length - trail.length);
      const href = safeUrl(bare.replace(/&amp;/g, "&"));
      return href ? `${before}<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${bare}</a>${trail}` : all;
    });
    s = s.replace(/\*\*\*(\S(?:[^*]*\S)?)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*(\S(?:[^*]*\S)?)\*\*/g, "<strong>$1</strong>");
    // The marks have to hug the words, or `a * b * c` turns into italics.
    s = s.replace(/(^|[^*\w])\*(\S(?:[^*\n]*\S)?)\*/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^_\w])_(\S(?:[^_\n]*\S)?)_(?!\w)/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    return s.replace(/\n/g, "<br>");
  };

  const out = [];
  const stack = [];   // open lists, outermost first
  let para = [];      // lines of the paragraph being read
  let item = [];      // lines of the list item being read
  let quote = [];     // lines of the block quote being read
  let blank = false;  // was the line before this one empty?

  const flushItem = () => { if (item.length) { out.push(inline(item.join("\n"))); item = []; } };
  const flushPara = () => {
    if (stack.length) return flushItem();
    if (para.length) { out.push(`<p>${inline(para.join("\n"))}</p>`); para = []; }
  };
  const flushQuote = () => {
    if (!quote.length) return;
    out.push(`<blockquote>${inline(quote.join("\n"))}</blockquote>`);
    quote = [];
  };
  const closeLists = (indent) => {
    flushItem();
    while (stack.length && stack[stack.length - 1].indent >= indent) {
      const list = stack.pop();
      out.push(`</li></${list.tag}>`);
    }
  };
  const closeAll = () => { flushQuote(); flushPara(); closeLists(0); };
  const add = (line) => (stack.length ? item : para).push(line);

  const lines = body.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const bare = line.trim();

    if (!bare) { flushQuote(); flushItem(); if (!stack.length) flushPara(); blank = true; continue; }

    // A blank line then something flush with the margin is the end of the list;
    // indent the same thing instead and it stays inside the item. The next
    // bullet, of course, carries the list on.
    const startsItem = /^\s*([-*+]|\d+[.)])\s+/.test(line);
    if (blank && stack.length && !startsItem && !/^\s{2,}/.test(line)) closeLists(0);
    blank = false;

    if (bare.startsWith(">")) { flushPara(); flushItem(); quote.push(bare.replace(/^>\s?/, "")); continue; }
    flushQuote();

    // A held code block stands on its own line; inside a list it belongs to the item.
    const only = bare.match(new RegExp(`^${MD_HOLD}(\\d+)${MD_HOLD}$`));
    if (only) { flushItem(); if (!stack.length) flushPara(); out.push(held[Number(only[1])]); continue; }

    const heading = bare.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      closeAll();
      const level = Math.min(heading[1].length + 2, 6);
      const size = heading[1].length <= 2 ? "md-title-medium" : "md-title-small";
      out.push(`<h${level} class="md-head ${size}">${inline(heading[2])}</h${level}>`);
      continue;
    }

    if (/^([-*_])\1{2,}$/.test(bare)) { closeAll(); out.push("<hr>"); continue; }

    // A table needs its header underline on the next line to count as one.
    if (bare.startsWith("|") && /^\|?[\s:|-]+\|[\s:|-]*$/.test((lines[i + 1] || "").trim()) && (lines[i + 1] || "").includes("-")) {
      closeAll();
      const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const head = cells(bare);
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      i--;
      out.push(`<table class="md-table"><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>`
        + `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
